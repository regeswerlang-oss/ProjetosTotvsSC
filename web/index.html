// ============================================================================
//  ABA CONSUMO — resumo por etapa contra a base líquida do projeto
//  PROTÓTIPO (12/08/2026) — desenho a validar com o usuário.
// ============================================================================
// Grupos que NÃO entram nem aparecem: são esforço de gestão, não de entrega,
// e distorceriam o consumo por etapa.
const CONSUMO_FORA = ['monitoramento e controle', 'encerramento'];

const consumo = { desconto: 1006, excluidos: new Set(), iniciado: false };

const chaveAtiv = (it) =>
  `${it.subReal}|${it.modulo}|${(it.atividade?.descricao || '').trim()}`;

function foraDoConsumo(it) {
  const alvo = semAcento(`${it.fase || ''} ${it.etapa || ''} ${it.subReal || ''}`);
  return CONSUMO_FORA.some(g => alvo.includes(g));
}

function renderConsumo() {
  const box = $('#cons-conteudo');
  if (!state.cronograma) {
    box.innerHTML = '<div class="text-slate-400 text-sm py-6 text-center">Carregando cronograma…</div>';
    return;
  }
  // A base parte das Horas Previstas do projeto; o usuário pode ajustar as duas
  if (!consumo.iniciado) {
    consumo.iniciado = true;
    $('#cons-total').value = Math.round(state.projHorasPrevistas || 0);
  }

  const itens = coletaAtividades(state.cronograma).filter(it => !foraDoConsumo(it));
  const total = Number($('#cons-total').value || 0);
  const desconto = Number($('#cons-desconto').value || 0);
  const base = Math.max(0, total - desconto);
  $('#cons-base').textContent = `${fmtH(base)} h`;

  // Agrupa por etapa (sub-etapa real do MIT), na ordem natural do método
  const porEtapa = {};
  itens.forEach(it => (porEtapa[it.subReal] = porEtapa[it.subReal] || []).push(it));
  const linhas = Object.entries(porEtapa)
    .map(([etapa, lista]) => {
      const dentro = lista.filter(it => !consumo.excluidos.has(chaveAtiv(it)));
      return { etapa, lista, dentro, agg: agrega(dentro), aggTudo: agrega(lista) };
    })
    .sort((a, b) => ordemEtapa(a.etapa) - ordemEtapa(b.etapa) || b.aggTudo.estimadas - a.aggTudo.estimadas);

  const somaExec = linhas.reduce((a, l) => a + l.agg.executadas, 0);
  const somaEst = linhas.reduce((a, l) => a + l.agg.estimadas, 0);
  const nExcl = consumo.excluidos.size;

  const kpi = (rot, val, sub, cls) => `
    <div class="rounded-lg p-4 ${cls}"><p class="text-xs opacity-80">${rot}</p>
      <p class="text-2xl font-totvs mt-1">${val}</p><p class="text-xs opacity-80 mt-0.5">${sub}</p></div>`;
  $('#cons-kpis').innerHTML =
    kpi('Base de comparação', fmtH(base), `${fmtH(total)} − ${fmtH(desconto)} de personalizações`, 'bg-totvs-petroleo text-white') +
    kpi('Realizado nas etapas', fmtH(somaExec), base > 0 ? `${(100 * somaExec / base).toFixed(1)}% da base` : '—', 'bg-totvs-blue text-totvs-petroleo') +
    kpi('Estimado nas etapas', fmtH(somaEst), base > 0 ? `${(100 * somaEst / base).toFixed(1)}% da base` : '—', 'bg-totvs-purple text-white') +
    kpi('Saldo da base', fmtH(base - somaExec), `${linhas.length} etapa(s)${nExcl ? ` · ${nExcl} item(ns) fora` : ''}`, 'bg-white border border-slate-200 text-totvs-petroleo');

  const barra = (pct, cor) => `
    <div class="bar-track"><div class="bar-fill ${cor}" style="width:${Math.min(100, Math.max(0, pct)).toFixed(1)}%"></div></div>`;

  const linhaEtapa = (l) => {
    const pctBase = base > 0 ? (100 * l.agg.executadas / base) : 0;
    const pctExec = l.agg.estimadas > 0 ? (100 * l.agg.executadas / l.agg.estimadas) : 0;
    const especifico = semAcento(l.etapa).includes('especifico');
    const fora = l.lista.length - l.dentro.length;
    return `
      <tr class="border-t border-slate-100 ${especifico ? 'cursor-pointer hover:bg-slate-50' : ''}"
          ${especifico ? 'data-abre-especificos' : ''}>
        <td class="py-2.5 pr-3 font-medium">
          ${especifico ? '<span class="text-slate-400 mr-1">▸</span>' : ''}${escapeHtml(l.etapa)}
          ${fora ? `<span class="ml-2 text-xs text-amber-700 bg-amber-100 px-1.5 py-0.5 rounded-full">${fora} fora</span>` : ''}
        </td>
        <td class="py-2.5 pr-3 text-right tabular-nums">${fmtH(l.agg.estimadas)}</td>
        <td class="py-2.5 pr-3 text-right tabular-nums font-medium">${fmtH(l.agg.executadas)}</td>
        <td class="py-2.5 pr-3 text-right tabular-nums text-slate-500">${fmtH(l.agg.planejadas)}</td>
        <td class="py-2.5 pr-3 text-right tabular-nums">${pctExec.toFixed(0)}%</td>
        <td class="py-2.5 pr-3 w-48">${barra(pctBase, 'fill-exec')}</td>
        <td class="py-2.5 text-right tabular-nums font-semibold text-totvs-petroleo">${pctBase.toFixed(1)}%</td>
      </tr>`;
  };

  // Específicos: cada atividade com caixa para entrar ou não no cálculo
  const especificos = linhas.find(l => semAcento(l.etapa).includes('especifico'));
  const listaEsp = especificos ? especificos.lista.slice()
    .sort((a, b) => (b.atividade.horas_previstas || 0) - (a.atividade.horas_previstas || 0)) : [];

  box.innerHTML = `
    <div class="bg-white rounded-lg border border-slate-200 p-5 overflow-x-auto">
      <div class="flex items-baseline justify-between mb-3">
        <h3 class="text-sm font-semibold text-slate-700">Consumo por etapa</h3>
        <p class="text-xs text-slate-400">Monitoramento e Controle e Encerramento ficam fora do cálculo e da tela.</p>
      </div>
      <table class="w-full text-sm">
        <thead><tr class="text-xs text-slate-500 text-left border-b border-slate-200">
          <th class="pb-2 pr-3">Etapa</th>
          <th class="pb-2 pr-3 text-right">Estimadas</th>
          <th class="pb-2 pr-3 text-right">Realizadas</th>
          <th class="pb-2 pr-3 text-right">A realizar</th>
          <th class="pb-2 pr-3 text-right">% da etapa</th>
          <th class="pb-2 pr-3">Consumo da base</th>
          <th class="pb-2 text-right">% da base</th>
        </tr></thead>
        <tbody>${linhas.map(linhaEtapa).join('')}</tbody>
        <tfoot class="border-t-2 border-slate-300 font-semibold bg-slate-50">
          <tr>
            <td class="py-2.5 pr-3">Total das etapas</td>
            <td class="py-2.5 pr-3 text-right tabular-nums">${fmtH(somaEst)}</td>
            <td class="py-2.5 pr-3 text-right tabular-nums">${fmtH(somaExec)}</td>
            <td class="py-2.5 pr-3 text-right tabular-nums">${fmtH(linhas.reduce((a, l) => a + l.agg.planejadas, 0))}</td>
            <td class="py-2.5 pr-3 text-right tabular-nums">${somaEst > 0 ? (100 * somaExec / somaEst).toFixed(0) : 0}%</td>
            <td class="py-2.5 pr-3">${barra(base > 0 ? 100 * somaExec / base : 0, 'fill-exec')}</td>
            <td class="py-2.5 text-right tabular-nums">${base > 0 ? (100 * somaExec / base).toFixed(1) : '0,0'}%</td>
          </tr>
        </tfoot>
      </table>
    </div>

    ${listaEsp.length ? `
    <div id="cons-especificos" class="bg-white rounded-lg border border-slate-200 p-5 mt-4">
      <div class="flex items-center justify-between mb-3">
        <h3 class="text-sm font-semibold text-slate-700">Específicos · o que entra no cálculo</h3>
        <div class="flex gap-2 text-xs">
          <button data-esp="todos" class="px-2 py-1 rounded border border-slate-300 hover:bg-slate-50">Marcar todos</button>
          <button data-esp="nenhum" class="px-2 py-1 rounded border border-slate-300 hover:bg-slate-50">Desmarcar todos</button>
        </div>
      </div>
      <table class="w-full text-sm">
        <thead><tr class="text-xs text-slate-500 text-left border-b border-slate-200">
          <th class="pb-2 pr-3 w-10"></th><th class="pb-2 pr-3">Atividade</th>
          <th class="pb-2 pr-3">Módulo</th>
          <th class="pb-2 pr-3 text-right">Estimadas</th>
          <th class="pb-2 text-right">Realizadas</th>
        </tr></thead>
        <tbody>${listaEsp.map(it => {
          const k = chaveAtiv(it);
          const on = !consumo.excluidos.has(k);
          return `<tr class="border-t border-slate-100 ${on ? '' : 'opacity-50'}">
            <td class="py-2 pr-3"><input type="checkbox" data-ativ="${escapeHtml(k)}" ${on ? 'checked' : ''} class="accent-totvs-blue"></td>
            <td class="py-2 pr-3">${escapeHtml(it.atividade.descricao || '—')}</td>
            <td class="py-2 pr-3 text-xs text-slate-500">${escapeHtml(it.modulo || '—')}</td>
            <td class="py-2 pr-3 text-right tabular-nums">${fmtH(it.atividade.horas_previstas || 0)}</td>
            <td class="py-2 text-right tabular-nums">${fmtH(it.atividade.horas_realizadas || 0)}</td>
          </tr>`;
        }).join('')}</tbody>
      </table>
    </div>` : ''}`;

  // Marcar/desmarcar recalcula tudo — a base não muda, mas as etapas sim
  box.querySelectorAll('[data-ativ]').forEach(c => c.addEventListener('change', () => {
    const k = c.dataset.ativ;
    if (c.checked) consumo.excluidos.delete(k); else consumo.excluidos.add(k);
    renderConsumo();
  }));
  box.querySelectorAll('[data-esp]').forEach(b => b.addEventListener('click', () => {
    if (b.dataset.esp === 'todos') listaEsp.forEach(it => consumo.excluidos.delete(chaveAtiv(it)));
    else listaEsp.forEach(it => consumo.excluidos.add(chaveAtiv(it)));
    renderConsumo();
  }));
  const alvo = box.querySelector('#cons-especificos');
  box.querySelectorAll('[data-abre-especificos]').forEach(tr =>
    tr.addEventListener('click', () => alvo?.scrollIntoView({ behavior: 'smooth', block: 'start' })));
}

['cons-total', 'cons-desconto'].forEach(id =>
  $(`#${id}`).addEventListener('input', renderConsumo));
$('#cons-reset').addEventListener('click', () => {
  consumo.excluidos.clear();
  $('#cons-desconto').value = 1006;
  renderConsumo();
});

// ============================================================================
//  ABA GAPs — tickets com a tag GAP do cliente do projeto aberto
// ============================================================================
const gap = { customer: null, itens: [], modo: 'lista' };

// Ordem do Kanban = fluxo real do atendimento, não ordem alfabética
const GAP_STATUS = ['Novo', 'Aberto', 'Em Andamento', 'Agendado', 'Em Espera',
                    'Em Validacao', 'Validacao Cliente', 'Resolvido', 'Cancelado'];
const DECISAO = {
  aprovar: { label: 'Aprovado', cls: 'bg-emerald-100 text-emerald-800' },
  segunda_fase: { label: '2ª fase', cls: 'bg-sky-100 text-sky-800' },
  contorno: { label: 'Contorno', cls: 'bg-amber-100 text-amber-800' },
  entendimento_projeto: { label: 'Entendimento', cls: 'bg-violet-100 text-violet-800' },
  recusar: { label: 'Recusado', cls: 'bg-rose-100 text-rose-800' },
  pendente: { label: 'Pendente', cls: 'bg-slate-100 text-slate-700' },
};

async function initGaps() {
  const cli = state.selected?.cli;
  $('#gap-cliente-nome').textContent =
    (state.selected?.projeto?.nome_cliente_projeto || '').trim() || cli || '—';
  if (gap.customer === cli) return;
  gap.customer = cli;
  if (!cli) { $('#gap-conteudo').innerHTML = blocoVazioCad('Abra um projeto para ver os GAPs do cliente.'); return; }
  $('#gap-conteudo').innerHTML = '<div class="text-slate-400 text-sm py-6 text-center">Carregando GAPs…</div>';
  try {
    const j = await api(`/api/gaps/${encodeURIComponent(cli)}`);
    gap.itens = j.gaps || [];
  } catch (e) {
    gap.customer = null;
    $('#gap-conteudo').innerHTML = blocoErro('Não foi possível carregar os GAPs', e, initGaps);
    return;
  }
  const etapas = [...new Set(gap.itens.map(g => g.etapa_gap).filter(Boolean))].sort();
  $('#gap-etapa').innerHTML = '<option value="">Todas as etapas</option>' +
    etapas.map(e => `<option value="${escapeHtml(e)}">${escapeHtml(e)}</option>`).join('');
  renderGaps();
}

// "balanca" tem que achar "Balança" — busca sem acento é o esperado em pt-BR
const semAcento = (s) => (s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();

function gapsFiltrados() {
  const q = semAcento($('#gap-busca').value.trim());
  const etapa = $('#gap-etapa').value;
  const dec = $('#gap-decisao').value;
  return gap.itens.filter(g => {
    if (etapa && g.etapa_gap !== etapa) return false;
    if (dec === '_sem' && g.decisao) return false;
    if (dec && dec !== '_sem' && g.decisao !== dec) return false;
    if (q) {
      const alvo = semAcento(`${g.id || ''} ${g.titulo || ''} ${g.produto || ''} ${g.competencia || ''} ${g.responsavel_nome || ''}`);
      if (!alvo.includes(q)) return false;
    }
    return true;
  });
}

function renderGaps() {
  const itens = gapsFiltrados();
  const horas = itens.reduce((a, g) => a + Number(g.time_estimate || 0), 0);
  const decididos = itens.filter(g => g.decisao && g.decisao !== 'pendente').length;
  const aprovados = itens.filter(g => g.decisao === 'aprovar').length;

  const kpi = (rot, val, sub, cls) => `
    <div class="rounded-lg p-4 ${cls}">
      <p class="text-xs opacity-80">${rot}</p>
      <p class="text-2xl font-totvs mt-1">${val}</p>
      <p class="text-xs opacity-80 mt-0.5">${sub}</p>
    </div>`;
  $('#gap-kpis').innerHTML =
    kpi('GAPs', String(itens.length), itens.length === gap.itens.length ? 'do cliente' : `de ${gap.itens.length} no total`, 'bg-totvs-petroleo text-white') +
    kpi('Horas estimadas', fmtNum(horas), 'soma das estimativas', 'bg-totvs-blue text-totvs-petroleo') +
    kpi('Decididos', `${decididos}/${itens.length}`, `${aprovados} aprovado(s)`, 'bg-totvs-purple text-white') +
    kpi('Sem decisão', String(itens.filter(g => !g.decisao).length), 'aguardando reunião', 'bg-white border border-slate-200 text-totvs-petroleo');

  $('#gap-conteudo').innerHTML = itens.length === 0
    ? blocoVazioCad('Nenhum GAP para este filtro.')
    : (gap.modo === 'kanban' ? kanbanGaps(itens) : listaGaps(itens));
}

function selosGap(g) {
  const d = g.decisao ? DECISAO[g.decisao] : null;
  return `${d ? `<span class="px-2 py-0.5 rounded-full text-xs font-medium ${d.cls}">${d.label}</span>` : ''}
    ${g.tem_alinhamento ? '<span class="px-2 py-0.5 rounded-full text-xs font-medium bg-slate-100 text-slate-600" title="Tem alinhamento comercial">◆</span>' : ''}`;
}

function listaGaps(itens) {
  return `
    <div class="bg-white rounded-lg border border-slate-200 overflow-x-auto">
      <table class="w-full text-sm">
        <thead><tr class="text-xs text-slate-500 text-left border-b border-slate-200">
          <th class="p-3">GAP</th><th class="p-3">Título</th><th class="p-3">Etapa</th>
          <th class="p-3">Status</th><th class="p-3">Produto</th>
          <th class="p-3 text-right">Horas</th><th class="p-3">Responsável</th>
          <th class="p-3">Decisão</th>
        </tr></thead>
        <tbody>${itens.map(g => `
          <tr data-gap="${g.uuid_ticket}" class="border-b border-slate-100 last:border-0 hover:bg-slate-50 cursor-pointer">
            <td class="p-3 font-mono text-xs">${escapeHtml(g.id || '—')}</td>
            <td class="p-3 font-medium">${escapeHtml(g.titulo || '—')}</td>
            <td class="p-3 text-xs">${escapeHtml(g.etapa_gap || '—')}</td>
            <td class="p-3 text-xs">${escapeHtml(g.status_tasks || '—')}</td>
            <td class="p-3 text-xs text-slate-500">${escapeHtml(g.produto || '—')}</td>
            <td class="p-3 text-right tabular-nums">${g.time_estimate ? fmtNum(g.time_estimate) : '—'}</td>
            <td class="p-3 text-xs">${escapeHtml((g.responsavel_nome || g.user_assigned || '—').trim())}</td>
            <td class="p-3">${selosGap(g) || '<span class="text-xs text-slate-400">—</span>'}</td>
          </tr>`).join('')}</tbody>
      </table>
    </div>`;
}

function kanbanGaps(itens) {
  const porStatus = new Map();
  itens.forEach(g => {
    const k = g.status_tasks || '(sem status)';
    if (!porStatus.has(k)) porStatus.set(k, []);
    porStatus.get(k).push(g);
  });
  const ordem = GAP_STATUS.filter(s => porStatus.has(s));
  [...porStatus.keys()].forEach(k => { if (!ordem.includes(k)) ordem.push(k); });

  return `<div class="flex gap-3 overflow-x-auto pb-2">${ordem.map(st => {
    const col = porStatus.get(st);
    const h = col.reduce((a, g) => a + Number(g.time_estimate || 0), 0);
    return `
      <div class="w-72 shrink-0 bg-slate-100 rounded-lg p-2">
        <div class="flex items-baseline justify-between px-1 pb-2">
          <span class="text-sm font-semibold text-totvs-petroleo">${escapeHtml(st)}</span>
          <span class="text-xs text-slate-500">${col.length} · ${fmtNum(h)}h</span>
        </div>
        <div class="space-y-2">${col.map(g => `
          <div data-gap="${g.uuid_ticket}" class="bg-white rounded-md border border-slate-200 p-3 cursor-pointer hover:border-totvs-blue">
            <div class="flex items-center justify-between gap-2">
              <span class="font-mono text-xs text-slate-500">${escapeHtml(g.id || '—')}</span>
              <span class="text-xs tabular-nums">${g.time_estimate ? fmtNum(g.time_estimate) + 'h' : ''}</span>
            </div>
            <p class="text-sm font-medium mt-1 leading-snug">${escapeHtml(g.titulo || '—')}</p>
            <p class="text-xs text-slate-500 mt-1">${escapeHtml(g.etapa_gap || '—')}${g.produto ? ' · ' + escapeHtml(g.produto) : ''}</p>
            <div class="mt-2 flex items-center gap-1">${selosGap(g)}</div>
          </div>`).join('')}</div>
      </div>`;
  }).join('')}</div>`;
}

$$('.gap-modo').forEach(b => b.addEventListener('click', () => {
  gap.modo = b.dataset.modo;
  $$('.gap-modo').forEach(x => {
    const on = x.dataset.modo === gap.modo;
    x.className = `gap-modo px-3 py-1.5 ${on ? 'bg-totvs-blue text-totvs-petroleo font-semibold' : 'bg-white text-slate-600 hover:bg-slate-50'}`;
  });
  renderGaps();
}));
['gap-busca', 'gap-etapa', 'gap-decisao'].forEach(id =>
  $(`#${id}`).addEventListener('input', renderGaps));
$('#gap-reload').addEventListener('click', () => { gap.customer = null; initGaps(); });
$('#tab-gaps').addEventListener('click', e => {
  const linha = e.target.closest('[data-gap]');
  if (linha) abreGap(linha.dataset.gap);
});

// ── Detalhe do GAP: dados + decisão + alinhamento comercial ────────────────
async function abreGap(uuid) {
  const painel = document.createElement('div');
  painel.className = 'fixed inset-0 z-50 bg-black/40 flex justify-end';
  painel.innerHTML = `<div class="bg-white w-full max-w-2xl h-full overflow-y-auto shadow-xl">
    <div class="p-6 text-slate-400 text-sm">Carregando GAP…</div></div>`;
  document.body.appendChild(painel);
  const caixa = painel.firstElementChild;
  const fecha = () => painel.remove();
  painel.addEventListener('click', e => { if (e.target === painel) fecha(); });

  let j;
  try {
    j = await api(`/api/gaps/ticket/${encodeURIComponent(uuid)}`);
  } catch (e) {
    caixa.innerHTML = `<div class="p-6">${blocoErro('Não foi possível abrir o GAP', e, () => { fecha(); abreGap(uuid); })}</div>`;
    return;
  }
  const t = j.ticket || {}, d = j.decisao || {}, a = j.alinhamento || {};
  const ta = (id, rot, valor, dica = '') => `
    <label class="block">
      <span class="text-xs font-medium text-slate-600">${rot}</span>
      ${dica ? `<span class="block text-xs text-slate-400 mb-1">${dica}</span>` : ''}
      <textarea id="${id}" rows="3" class="mt-1 w-full px-3 py-2 border border-slate-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-totvs-blue/40">${escapeHtml(valor || '')}</textarea>
    </label>`;

  caixa.innerHTML = `
    <div class="sticky top-0 bg-white border-b border-slate-200 px-6 py-4 flex items-start justify-between gap-4">
      <div>
        <p class="font-mono text-xs text-slate-500">${escapeHtml(t.id || '')} · ${escapeHtml(t.cliente || '')}</p>
        <h2 class="text-lg font-totvs text-totvs-petroleo mt-0.5">${escapeHtml(t.titulo || '—')}</h2>
      </div>
      <button data-fechar class="text-slate-400 hover:text-slate-700 text-2xl leading-none">×</button>
    </div>
    <div class="p-6 space-y-5 text-sm">
      <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
        ${[['Etapa', t.etapa_gap], ['Status', t.status_tasks], ['Classificação', t.classificacao_gap],
           ['Produto', t.produto], ['Horas estimadas', t.time_estimate ? fmtNum(t.time_estimate) : null],
           ['Responsável', (t.responsavel_nome || t.user_assigned || '').trim()],
           ['Resp. cliente', t.assigned_customer], ['Aging', t.aging_dias != null ? t.aging_dias + ' dias' : null]]
          .map(([r, v]) => `<div><p class="text-xs text-slate-500">${r}</p><p class="font-medium">${escapeHtml(v || '—')}</p></div>`).join('')}
      </div>

      ${t.descricao ? `<div>
        <h3 class="text-sm font-semibold text-slate-700 mb-1">Descrição</h3>
        <div class="bg-slate-50 rounded-md p-3 whitespace-pre-wrap text-slate-700 max-h-64 overflow-y-auto">${escapeHtml(t.descricao)}</div>
      </div>` : ''}

      <div>
        <h3 class="text-sm font-semibold text-slate-700 mb-1">Tags</h3>
        <div class="flex flex-wrap gap-1">${(j.tags || []).map(x =>
          `<span class="px-2 py-0.5 rounded-full bg-slate-100 text-xs text-slate-600">${escapeHtml(x.raw_tag)}</span>`).join('') || '<span class="text-xs text-slate-400">—</span>'}</div>
      </div>

      ${(j.ocorrencias || []).length ? `<div>
        <h3 class="text-sm font-semibold text-slate-700 mb-1">Ocorrências</h3>
        <div class="space-y-2 max-h-64 overflow-y-auto">${j.ocorrencias.map(o => `
          <div class="border-l-2 border-slate-200 pl-3">
            <p class="text-xs text-slate-500">${escapeHtml(o.autor || '—')} · ${escapeHtml(String(o.occurred_at || '').slice(0, 16).replace('T', ' '))}</p>
            <p class="whitespace-pre-wrap text-slate-700">${escapeHtml(o.details || '')}</p>
          </div>`).join('')}</div>
      </div>` : ''}

      <div class="border-t border-slate-200 pt-4">
        <h3 class="text-sm font-semibold text-slate-700 mb-2">Decisão</h3>
        <div class="flex flex-wrap gap-2 mb-3">${Object.entries(DECISAO).map(([k, v]) =>
          `<button data-dec="${k}" class="dec-btn px-3 py-1.5 rounded-md border text-xs font-medium ${d.decisao === k ? 'border-totvs-blue ' + v.cls : 'border-slate-300 bg-white text-slate-600 hover:bg-slate-50'}">${v.label}</button>`).join('')}</div>
        <div class="grid grid-cols-2 gap-3">
          <label class="block"><span class="text-xs text-slate-500">Estimativa (horas)</span>
            <input id="dec-est" type="number" step="0.5" value="${d.estimativa ?? ''}"
                   class="mt-1 w-full px-3 py-2 border border-slate-300 rounded-md"></label>
          <label class="block"><span class="text-xs text-slate-500">Classe</span>
            <input id="dec-classe" value="${escapeHtml(d.classe || '')}"
                   class="mt-1 w-full px-3 py-2 border border-slate-300 rounded-md"></label>
        </div>
        ${ta('dec-obs', 'Observação', d.observacao)}
        <p class="text-xs text-slate-400 mt-1">Grava só aqui (cockpit.decisoes) — não altera o Tasks SC.
          ${d.decided_by ? `Última: ${escapeHtml(d.decided_by)} em ${escapeHtml(String(d.decided_at || '').slice(0, 16).replace('T', ' '))}.` : ''}</p>
        <button id="dec-salvar" class="mt-2 px-3 py-1.5 rounded-md bg-totvs-blue text-totvs-petroleo font-semibold hover:bg-totvs-verde">Salvar decisão</button>
      </div>

      <div class="border-t border-slate-200 pt-4">
        <h3 class="text-sm font-semibold text-slate-700 mb-2">Alinhamento comercial</h3>
        <div class="space-y-3">
          ${ta('al-quest', 'Questionamento do cliente', a.questionamento_cliente)}
          ${ta('al-arg', '🔒 Argumentação interna', a.argumentacao_interna,
               'INTERNO — não expor ao cliente em e-mail nem em painel compartilhado.')}
          ${ta('al-reuniao', 'Alinhamento da reunião', a.alinhamento_reuniao)}
          ${ta('al-retorno', 'Retorno formal ao cliente', a.retorno_cliente)}
        </div>
        <button id="al-salvar" class="mt-3 px-3 py-1.5 rounded-md bg-totvs-blue text-totvs-petroleo font-semibold hover:bg-totvs-verde">Salvar alinhamento</button>
      </div>
      <p data-msg class="text-xs"></p>
    </div>`;

  caixa.querySelector('[data-fechar]').addEventListener('click', fecha);
  let escolhida = d.decisao || null;
  caixa.querySelectorAll('.dec-btn').forEach(b => b.addEventListener('click', () => {
    escolhida = b.dataset.dec;
    caixa.querySelectorAll('.dec-btn').forEach(x => {
      const on = x.dataset.dec === escolhida;
      x.className = `dec-btn px-3 py-1.5 rounded-md border text-xs font-medium ${on ? 'border-totvs-blue ' + DECISAO[x.dataset.dec].cls : 'border-slate-300 bg-white text-slate-600 hover:bg-slate-50'}`;
    });
  }));

  const msg = (txt, erro) => {
    const p = caixa.querySelector('[data-msg]');
    p.textContent = txt;
    p.className = `text-xs ${erro ? 'text-rose-600' : 'text-emerald-700'}`;
  };
  const salvar = async (btn, url, corpo, ok) => {
    btn.disabled = true;
    try {
      await api(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(corpo) });
      msg(ok, false);
      gap.customer = null;
      await initGaps();                     // reflete o selo na lista/kanban
    } catch (e) {
      msg(e.message, true);
    }
    btn.disabled = false;
  };

  caixa.querySelector('#dec-salvar').addEventListener('click', (e) => {
    if (!escolhida) { msg('Escolha uma decisão.', true); return; }
    salvar(e.target, `/api/gaps/ticket/${encodeURIComponent(uuid)}/decisao`, {
      decisao: escolhida,
      estimativa: caixa.querySelector('#dec-est').value,
      classe: caixa.querySelector('#dec-classe').value.trim(),
      observacao: caixa.querySelector('#dec-obs').value.trim(),
    }, 'Decisão salva.');
  });
  caixa.querySelector('#al-salvar').addEventListener('click', (e) => {
    salvar(e.target, `/api/gaps/ticket/${encodeURIComponent(uuid)}/alinhamento`, {
      questionamento_cliente: caixa.querySelector('#al-quest').value.trim(),
      argumentacao_interna: caixa.querySelector('#al-arg').value.trim(),
      alinhamento_reuniao: caixa.querySelector('#al-reuniao').value.trim(),
      retorno_cliente: caixa.querySelector('#al-retorno').value.trim(),
    }, 'Alinhamento salvo.');
  });
}

// ============================================================================
//  ABA CADASTROS (MONITCAD) — status de carga dos cadastros por cliente
// ============================================================================
const cad = { customer: null, ambiente: 'producao', dados: null };

function initCadastros(ambiente = 'producao') {
  const cli = state.selected?.cli;
  $('#cad-cliente-nome').textContent =
    (state.selected?.projeto?.nome_cliente_projeto || '').trim() || cli || '—';
  seloAmbiente($('#cad-amb-selo'), ambiente);
  // A chave do cache é o par cliente+ambiente: trocar de aba tem que rebuscar
  if (cad.customer === cli && cad.ambiente === ambiente) return;
  cad.ambiente = ambiente;
  carregaCadastros(cli);
}

$('#cad-reload').addEventListener('click', () => { cad.customer = null; initCadastros(cad.ambiente); });
$('#cad-file').addEventListener('change', enviaMedicao);

function blocoVazioCad(msg, extra = '') {
  return `<div class="bg-white rounded-lg border border-slate-200 p-10 text-center">
    <p class="text-slate-500">${escapeHtml(msg)}</p>${extra}</div>`;
}

async function carregaCadastros(customer) {
  cad.customer = customer || null;
  const box = $('#cad-conteudo');
  if (!customer) { box.innerHTML = blocoVazioCad('Abra um projeto para ver o status dos cadastros do cliente.'); return; }
  box.innerHTML = '<div class="text-slate-400 text-sm py-6 text-center">Carregando medições…</div>';
  let j;
  try {
    j = await api(`/api/monitcad/${encodeURIComponent(customer)}?ambiente=${cad.ambiente}`);
  } catch (e) {
    box.innerHTML = blocoErro('Não foi possível carregar os cadastros', e, () => carregaCadastros(customer));
    return;
  }
  cad.dados = j;                        // guardado para o export HTML / e-mail
  if (j.vazio) {
    box.innerHTML = blocoVazioCad(
      `Nenhuma medição na ${AMB[cad.ambiente].label} deste cliente.`,
      '<p class="text-xs text-slate-400 mt-2">Use "🗄 Script SQL" para levantar a contagem no banco ' +
      'e "⬆ Subir medição" para carregar o resultado. Cada base tem a sua própria série.</p>');
    return;
  }
  box.innerHTML = renderCadastros(j);
}

function corStatus(s) {
  return ({ VERDE: 'bg-emerald-100 text-emerald-800', AMARELO: 'bg-amber-100 text-amber-800',
            VERMELHO: 'bg-rose-100 text-rose-800' })[(s || '').toUpperCase()]
         || 'bg-slate-100 text-slate-700';
}

function renderCadastros(j) {
  const t = j.tabelas || [], serie = j.serie || [], p = j.projeto || {};
  const mods = j.modulos || [];
  const comEst = !!j.tem_estimativa;          // sem estimativa cadastrada não há %
  const totR = t.reduce((a, x) => a + Number(x.realizado || 0), 0);
  const totE = t.reduce((a, x) => a + Number(x.estimativa || 0), 0);
  const pct = totE > 0 ? (100 * totR / totE) : null;
  const comCarga = t.filter(x => Number(x.realizado || 0) > 0).length;
  const nVerm = t.filter(x => (x.status || '').toUpperCase() === 'VERMELHO').length;
  const nAmar = t.filter(x => (x.status || '').toUpperCase() === 'AMARELO').length;
  const antS = serie.length > 1 ? serie[serie.length - 2] : null;
  const deltaPct = (comEst && antS && antS.pct != null) ? (pct - Number(antS.pct)) : null;
  const deltaReg = antS ? (totR - Number(antS.realizado || 0)) : null;

  const kpi = (rot, val, sub, cls) => `
    <div class="rounded-lg p-4 ${cls}">
      <p class="text-xs opacity-80">${rot}</p>
      <p class="text-2xl font-totvs mt-1">${val}</p>
      ${sub ? `<p class="text-xs opacity-80 mt-0.5">${sub}</p>` : ''}
    </div>`;

  const kpis = comEst
    ? [kpi('Carga geral', pct.toFixed(1) + '%', deltaPct === null ? 'primeira medição' : `${deltaPct >= 0 ? '▲' : '▼'} ${Math.abs(deltaPct).toFixed(1)} p.p. vs anterior`, 'bg-totvs-petroleo text-white'),
       kpi('Registros carregados', fmtNum(totR), `de ${fmtNum(totE)} estimados`, 'bg-totvs-blue text-totvs-petroleo'),
       kpi('Tabelas monitoradas', String(t.length), `${comCarga} com carga`, 'bg-totvs-purple text-white'),
       kpi('Em risco', String(nVerm + nAmar), `${nVerm} vermelha(s) · ${nAmar} amarela(s)`, 'bg-white border border-slate-200 text-totvs-petroleo')]
    : [kpi('Registros carregados', fmtNum(totR), deltaReg === null ? 'primeira medição' : `${deltaReg >= 0 ? '▲' : '▼'} ${fmtNum(Math.abs(deltaReg))} vs anterior`, 'bg-totvs-petroleo text-white'),
       kpi('Tabelas com carga', `${comCarga}/${t.length}`, `${t.length - comCarga} ainda zerada(s)`, 'bg-totvs-blue text-totvs-petroleo'),
       kpi('Módulos', String(mods.length), 'com tabela monitorada', 'bg-totvs-purple text-white'),
       kpi('% de carga', '—', 'sem estimativa cadastrada', 'bg-white border border-slate-200 text-totvs-gray')];

  const aviso = comEst ? '' : `
    <div class="bg-totvs-yellow/10 border border-totvs-yellow/40 rounded-lg px-4 py-3 mb-4 text-sm">
      <span class="font-semibold text-totvs-petroleo">Sem estimativa cadastrada.</span>
      <span class="text-slate-600">Os números são a contagem absoluta da última medição.
      Para ter % e semáforo, cadastre a estimativa por tabela (monitcad.estimativas /
      TABELAS_MONITOR.TXT) ou suba um historico-semanal.json que já traga a estimativa.</span>
    </div>`;

  // ── Tabelas agrupadas por módulo (accordion) ──────────────────────────────
  const maxMod = Math.max(1, ...mods.map(m => Number(m.registros || 0)));
  const porModulo = new Map();
  t.forEach(x => {
    const k = x.modulo || '(sem módulo)';
    if (!porModulo.has(k)) porModulo.set(k, []);
    porModulo.get(k).push(x);
  });
  // Ordem dos grupos = a do backend (registros desc); sobras vão para o fim
  const ordem = mods.map(m => m.modulo).filter(k => porModulo.has(k));
  [...porModulo.keys()].forEach(k => { if (!ordem.includes(k)) ordem.push(k); });

  const cabecalho = comEst
    ? `<th class="pb-2 pr-3 text-right">Estimativa</th><th class="pb-2 pr-3 text-right">%</th>
       <th class="pb-2 pr-3">Progresso</th><th class="pb-2 pr-3">Etapa</th>
       <th class="pb-2 pr-3">Responsável</th><th class="pb-2 pr-3">Previsão</th><th class="pb-2">Status</th>`
    : '<th class="pb-2">Situação</th>';

  const linhaTabela = (x) => {
    const est = Number(x.estimativa || 0);
    const pc = x.percentual != null ? Number(x.percentual)
             : (est > 0 ? 100 * Number(x.realizado) / est : null);
    return `<tr class="border-t border-slate-100">
      <td class="py-2 pr-3 font-mono text-xs">${escapeHtml(x.tabela || '')}</td>
      <td class="py-2 pr-3">${escapeHtml(x.descricao || '—')}</td>
      <td class="py-2 pr-3 text-right tabular-nums ${Number(x.realizado) > 0 ? 'font-medium' : 'text-slate-400'}">${fmtNum(x.realizado)}</td>
      ${comEst ? `
      <td class="py-2 pr-3 text-right tabular-nums">${est > 0 ? fmtNum(est) : '—'}</td>
      <td class="py-2 pr-3 text-right tabular-nums font-semibold">${pc === null ? '—' : pc.toFixed(1) + '%'}</td>
      <td class="py-2 pr-3 w-40"><div class="bar-track"><div class="bar-fill fill-exec" style="width:${pc === null ? 0 : Math.min(100, pc).toFixed(1)}%"></div></div></td>
      <td class="py-2 pr-3 text-xs">${escapeHtml(x.etapa || '—')}</td>
      <td class="py-2 pr-3 text-xs">${escapeHtml(x.responsavel || '—')}</td>
      <td class="py-2 pr-3 text-xs">${x.data_prev ? fmtData(String(x.data_prev)) : '—'}</td>
      <td class="py-2"><span class="px-2 py-0.5 rounded-full text-xs font-medium ${corStatus(x.status)}">${escapeHtml(x.status || '—')}</span></td>`
      : `<td class="py-2"><span class="px-2 py-0.5 rounded-full text-xs font-medium ${Number(x.realizado) > 0 ? 'bg-emerald-100 text-emerald-800' : 'bg-slate-100 text-slate-500'}">${Number(x.realizado) > 0 ? 'Com carga' : 'Zerada'}</span></td>`}
    </tr>`;
  };

  const grupos = ordem.map(nome => {
    const itens = porModulo.get(nome);
    const reg = itens.reduce((a, x) => a + Number(x.realizado || 0), 0);
    const cc = itens.filter(x => Number(x.realizado || 0) > 0).length;
    // Já abre nos módulos que têm carga; os zerados nascem recolhidos
    return `
      <details class="cad-grupo border-b border-slate-100 last:border-b-0" ${reg > 0 ? 'open' : ''}>
        <summary class="flex items-center gap-3 py-2.5 text-sm hover:bg-slate-50 -mx-2 px-2 rounded">
          <span class="chev text-slate-400 text-xs">▶</span>
          <span class="w-48 truncate font-medium ${reg > 0 ? 'text-totvs-petroleo' : 'text-slate-500'}">${escapeHtml(nome)}</span>
          <div class="flex-1 bar-track"><div class="bar-fill fill-exec" style="width:${(100 * reg / maxMod).toFixed(1)}%"></div></div>
          <span class="w-24 text-right tabular-nums font-semibold ${reg > 0 ? '' : 'text-slate-400'}">${fmtNum(reg)}</span>
          <span class="w-24 text-right text-xs text-slate-500">${cc}/${itens.length} tabelas</span>
        </summary>
        <div class="overflow-x-auto pl-7 pb-3">
          <table class="w-full text-sm">
            <thead><tr class="text-xs text-slate-500 text-left">
              <th class="pb-2 pr-3">Tabela</th><th class="pb-2 pr-3">Descrição</th>
              <th class="pb-2 pr-3 text-right">Realizado</th>
              ${cabecalho}
            </tr></thead>
            <tbody>${itens.map(linhaTabela).join('')}</tbody>
          </table>
        </div>
      </details>`;
  }).join('');

  const maxSerie = Math.max(1, ...serie.map(s => Number(s.realizado || 0)));
  const hist = serie.map(s => {
    const largura = comEst && s.pct != null ? Math.min(100, Number(s.pct))
                                            : (100 * Number(s.realizado || 0) / maxSerie);
    const valor = comEst && s.pct != null ? Number(s.pct).toFixed(1) + '%' : fmtNum(s.realizado);
    return `<div class="flex items-center gap-3 text-sm">
      <span class="w-28 text-slate-500 text-xs">${fmtData(String(s.data_medicao))}${s.semana ? ` · S${s.semana}` : ''}</span>
      <div class="flex-1 bar-track"><div class="bar-fill fill-exec" style="width:${largura.toFixed(1)}%"></div></div>
      <span class="w-24 text-right tabular-nums font-medium">${valor}</span>
      <span class="w-24 text-right text-xs text-slate-500">${s.tabelas_com_carga} c/ carga</span>
    </div>`;
  }).join('');

  return `
    <div class="bg-white rounded-lg border border-slate-200 p-5 mb-4">
      <div class="flex items-start justify-between flex-wrap gap-3">
        <div>
          <p class="text-xs text-totvs-blue uppercase tracking-wide font-semibold">${escapeHtml(p.cliente_nome || '')}</p>
          <h2 class="text-xl font-totvs text-totvs-petroleo mt-0.5">${escapeHtml(p.projeto || 'Monitoramento de Cadastros')}</h2>
        </div>
        <p class="text-xs text-slate-500">Última medição: <span class="font-medium">${fmtData(String(j.ultima_medicao || ''))}</span> · ${j.total_medicoes} medição(ões)</p>
      </div>
    </div>
    ${aviso}
    <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4">${kpis.join('')}</div>
    <div class="bg-white rounded-lg border border-slate-200 p-5 mb-4">
      <h3 class="text-sm font-semibold text-slate-700 mb-3">Evolução por medição</h3>
      <div class="space-y-2">${hist || '<p class="text-sm text-slate-400">Sem histórico.</p>'}</div>
    </div>
    <div class="bg-white rounded-lg border border-slate-200 p-5">
      <div class="flex items-center justify-between mb-3">
        <h3 class="text-sm font-semibold text-slate-700">Tabelas monitoradas por módulo</h3>
        <div class="flex items-center gap-2 text-xs">
          <button data-act="cad-expandir" class="px-2 py-1 rounded border border-slate-300 hover:bg-slate-50">Expandir</button>
          <button data-act="cad-recolher" class="px-2 py-1 rounded border border-slate-300 hover:bg-slate-50">Recolher</button>
        </div>
      </div>
      ${grupos || '<p class="text-sm text-slate-400">Sem tabelas na última medição.</p>'}
    </div>`;
}

function fmtNum(n) {
  return Number(n || 0).toLocaleString('pt-BR', { maximumFractionDigits: 0 });
}

async function enviaMedicao(ev) {
  const f = ev.target.files?.[0];
  ev.target.value = '';
  if (!f) return;
  const cli = state.selected?.cli;
  if (!cli) { alert('Abra um projeto antes de subir a medição.'); return; }
  // O backend aceita os dois formatos; o Content-Type é só a dica de qual é
  const csv = /\.csv$/i.test(f.name);
  const texto = await f.text();
  if (!csv) {
    try { JSON.parse(texto); }
    catch (e) { alert('Arquivo não é um JSON nem um CSV válido: ' + e.message); return; }
  }
  // Sempre confirmar a base: subir teste em cima de produção contamina a série
  confirmaAmbiente(f.name, cad.ambiente, async (amb, m) => {
    m.ocupado(true, 'Enviando…');
    try {
      const j = await api(`/api/monitcad/${encodeURIComponent(cli)}/upload?ambiente=${amb}`, {
        method: 'POST',
        headers: { 'Content-Type': csv ? 'text/csv; charset=utf-8' : 'application/json' },
        body: texto,
      });
      m.fecha();
      alert(`${AMB[amb].label}: ${j.medicoes} medição(ões), ${j.tabelas} linha(s) (${j.formato}).`);
      // Se o arquivo era de outra base, vai para a sub-aba dela — deixar
      // "Produção" mostrando dado de teste é a confusão que custa caro
      cad.customer = null;
      setSub(amb === 'teste' ? 'cad_teste' : 'cad_prod');
    } catch (e) {
      m.ocupado(false, 'Importar');
      m.erro(e.message);
    }
  });
}

// Pergunta de qual base veio o arquivo — vale para cadastros e movimentos
function confirmaAmbiente(nomeArquivo, sugerido, aoConfirmar) {
  const opcao = (v) => `
    <label class="flex items-start gap-2 p-3 rounded-md border ${v === sugerido ? 'border-totvs-blue bg-totvs-blue/5' : 'border-slate-300'} cursor-pointer">
      <input type="radio" name="amb" value="${v}" ${v === sugerido ? 'checked' : ''} class="mt-0.5 accent-totvs-blue">
      <span>
        <span class="font-semibold">${AMB[v].label}</span>
        <span class="block text-xs text-slate-500">${v === 'producao'
          ? 'Base real do cliente — alimenta o acompanhamento oficial.'
          : 'Base de homologação — série separada, não mistura com produção.'}</span>
      </span>
    </label>`;
  const m = modal('De qual base veio este arquivo?',
    `<p class="text-xs text-slate-500">Arquivo: <span class="font-mono">${escapeHtml(nomeArquivo)}</span></p>
     <div class="space-y-2">${opcao('producao')}${opcao('teste')}</div>
     <p class="text-xs text-slate-400">Produção e teste têm séries independentes: uma nunca sobrescreve a outra,
       mesmo na mesma data.</p>`,
    'Importar');
  m.aoConfirmar(() => {
    const escolhido = m.el.querySelector('input[name="amb"]:checked')?.value || sugerido;
    aoConfirmar(escolhido, m);
  });
}

const tr = { customer: null, atual: null, podeSubir: false };

async function initTransicao() {
  const cli = state.selected?.cli;
  $('#tr-cliente-nome').textContent =
    (state.selected?.projeto?.nome_cliente_projeto || '').trim() || cli || '—';
  if (tr.customer === cli) return;        // já carregado para este cliente
  tr.customer = cli;
  tr.atual = null;
  $('#transicao-box').classList.add('hidden');
  $('#tr-painel').classList.add('hidden');
  if (!cli) { $('#tr-conteudo').innerHTML = blocoVazioCad('Abra um projeto para ver o painel do cliente.'); return; }

  let j;
  try {
    j = await api('/api/paineis');
  } catch (e) {
    tr.customer = null;
    $('#tr-conteudo').innerHTML = blocoErro('Não foi possível listar os painéis', e, initTransicao);
    return;
  }
  tr.podeSubir = !!j.pode_subir;
  $('#tr-upload-wrap').classList.toggle('hidden', !tr.podeSubir);
  const meus = (j.paineis || []).filter(p => p.customer === cli);   // só o cliente aberto

  if (meus.length === 0) {
    $('#tr-conteudo').innerHTML = blocoVazioCad(
      'Nenhum painel publicado para este cliente.',
      tr.podeSubir
        ? '<p class="text-xs text-slate-400 mt-2">Use "⬆ Publicar painel (.html)" para subir o HTML do status por atividades.</p>'
        : '<p class="text-xs text-slate-400 mt-2">Peça ao administrador para publicar o painel deste cliente.</p>');
    return;
  }
  const sel = $('#tr-painel');
  sel.innerHTML = meus.map(p => `<option value="${p.customer}/${p.slug}">${escapeHtml(p.titulo || p.slug)}</option>`).join('');
  sel.classList.toggle('hidden', meus.length < 2);   // seletor só quando há escolha
  sel.onchange = () => abrePainel(sel.value);
  abrePainel(`${meus[0].customer}/${meus[0].slug}`);
}

function abrePainel(ref) {
  tr.atual = ref || null;
  const box = $('#transicao-box'), fr = $('#frame-transicao');
  if (!ref) { box.classList.add('hidden'); $('#tr-conteudo').innerHTML = blocoVazioCad('Selecione o painel para visualizar.'); return; }
  $('#tr-conteudo').innerHTML = '';
  box.classList.remove('hidden');
  fr.src = `/painel/${ref}`;
  // Página inteira dentro do iframe: acompanha a altura para não ter scroll duplo
  const ajusta = () => {
    try {
      const h = fr.contentDocument?.body?.scrollHeight;
      fr.style.height = h ? (h + 40) + 'px' : '85vh';
    } catch { fr.style.height = '85vh'; }
  };
  fr.onload = () => { ajusta(); setTimeout(ajusta, 800); };
  window.addEventListener('resize', ajusta);
}

async function publicaPainel(ev) {
  const f = ev.target.files?.[0];
  ev.target.value = '';
  if (!f) return;
  const cli = state.selected?.cli;
  if (!cli) { alert('Abra um projeto antes de publicar o painel.'); return; }
  // Publica sempre no cliente do projeto aberto; o slug identifica o painel
  const slug = tr.atual ? tr.atual.split('/')[1]
             : (prompt('Identificador do painel (slug):', 'transicao') || '').trim();
  if (!slug) return;
  const titulo = prompt('Título do painel:', f.name.replace(/\.html?$/i, '')) || slug;
  try {
    const j = await api(`/api/paineis/${encodeURIComponent(cli)}/${encodeURIComponent(slug)}?titulo=${encodeURIComponent(titulo)}`,
      { method: 'POST', headers: { 'Content-Type': 'text/html' }, body: await f.text() });
    alert(`Painel publicado (${(j.bytes / 1024).toFixed(0)} KB).`);
    tr.customer = null;                 // força recarregar a lista do cliente
    await initTransicao();
  } catch (e) {
    alert('Falha ao publicar o painel: ' + e.message);
  }
}

$('#tr-file').addEventListener('change', publicaPainel);

//  CADASTROS — relatório autocontido (export HTML e corpo do e-mail)
//  Sem Tailwind e sem <script>: estilo inline, para abrir em qualquer lugar
//  (arquivo solto, anexo, cliente de e-mail).
// ============================================================================
function relatorioCadastrosHTML() {
  const j = cad.dados;
  if (!j || j.vazio) return null;
  const t = j.tabelas || [], mods = j.modulos || [], serie = j.serie || [];
  const p = j.projeto || {}, comEst = !!j.tem_estimativa;
  const totR = t.reduce((a, x) => a + Number(x.realizado || 0), 0);
  const totE = t.reduce((a, x) => a + Number(x.estimativa || 0), 0);
  const comCarga = t.filter(x => Number(x.realizado || 0) > 0).length;
  const pct = totE > 0 ? (100 * totR / totE) : null;
  const maxMod = Math.max(1, ...mods.map(m => Number(m.registros || 0)));
  const cliente = (state.selected?.projeto?.nome_cliente_projeto || p.cliente_nome || '').trim();

  const C = { petroleo: '#002233', blue: '#00DBFF', roxo: '#A44DFF', cinza: '#545454',
              borda: '#e2e8f0', claro: '#f8fafc' };
  const cel = 'padding:6px 10px;border-top:1px solid ' + C.borda + ';font-size:13px';
  const kpi = (rot, val, sub, bg, fg) => `
    <td style="padding:0 6px 0 0;width:25%;vertical-align:top">
      <div style="background:${bg};color:${fg};border-radius:8px;padding:14px 16px">
        <div style="font-size:11px;opacity:.85">${rot}</div>
        <div style="font-size:24px;font-weight:700;margin-top:2px">${val}</div>
        <div style="font-size:11px;opacity:.85">${sub}</div>
      </div></td>`;

  const kpis = comEst
    ? kpi('Carga geral', pct.toFixed(1) + '%', `${fmtNum(totR)} de ${fmtNum(totE)}`, C.petroleo, '#fff')
      + kpi('Registros carregados', fmtNum(totR), 'na última medição', C.blue, C.petroleo)
      + kpi('Tabelas monitoradas', String(t.length), `${comCarga} com carga`, C.roxo, '#fff')
      + kpi('Módulos', String(mods.length), 'com tabela monitorada', '#fff', C.petroleo)
    : kpi('Registros carregados', fmtNum(totR), 'na última medição', C.petroleo, '#fff')
      + kpi('Tabelas com carga', `${comCarga}/${t.length}`, `${t.length - comCarga} ainda zerada(s)`, C.blue, C.petroleo)
      + kpi('Módulos', String(mods.length), 'com tabela monitorada', C.roxo, '#fff')
      + kpi('% de carga', '—', 'sem estimativa cadastrada', '#fff', C.cinza);

  const barra = (largura) => `
    <div style="background:#e6edf0;border-radius:99px;height:8px;overflow:hidden">
      <div style="background:${C.blue};height:8px;width:${largura}%"></div></div>`;

  const blocoMod = mods.map(m => `
    <tr>
      <td style="${cel};width:200px">${escapeHtml(m.modulo)}</td>
      <td style="${cel};width:45%">${barra((100 * Number(m.registros || 0) / maxMod).toFixed(1))}</td>
      <td style="${cel};text-align:right;font-weight:600">${fmtNum(m.registros)}</td>
      <td style="${cel};text-align:right;color:${C.cinza}">${m.com_carga}/${m.tabelas} tabelas</td>
    </tr>`).join('');

  const hist = serie.map(s => `
    <tr>
      <td style="${cel};width:200px">${fmtData(String(s.data_medicao))}${s.semana ? ` · S${s.semana}` : ''}</td>
      <td style="${cel};width:45%">${barra(comEst && s.pct != null ? Math.min(100, Number(s.pct)).toFixed(1)
                                                         : (100 * Number(s.realizado || 0) / Math.max(1, ...serie.map(x => Number(x.realizado || 0)))).toFixed(1))}</td>
      <td style="${cel};text-align:right;font-weight:600">${comEst && s.pct != null ? Number(s.pct).toFixed(1) + '%' : fmtNum(s.realizado)}</td>
      <td style="${cel};text-align:right;color:${C.cinza}">${s.tabelas_com_carga} c/ carga</td>
    </tr>`).join('');

  const porMod = new Map();
  t.forEach(x => {
    const k = x.modulo || '(sem módulo)';
    if (!porMod.has(k)) porMod.set(k, []);
    porMod.get(k).push(x);
  });
  const ordem = mods.map(m => m.modulo).filter(k => porMod.has(k));
  [...porMod.keys()].forEach(k => { if (!ordem.includes(k)) ordem.push(k); });

  const detalhe = ordem.map(nome => {
    const itens = porMod.get(nome);
    const reg = itens.reduce((a, x) => a + Number(x.realizado || 0), 0);
    return `
      <h3 style="font-size:14px;margin:18px 0 6px;color:${C.petroleo}">
        ${escapeHtml(nome)}
        <span style="font-weight:400;color:${C.cinza}">· ${fmtNum(reg)} registro(s) ·
        ${itens.filter(x => Number(x.realizado || 0) > 0).length}/${itens.length} tabelas com carga</span>
      </h3>
      <table style="width:100%;border-collapse:collapse">
        <tr style="background:${C.claro};font-size:11px;color:${C.cinza};text-align:left">
          <th style="padding:6px 10px">Tabela</th><th style="padding:6px 10px">Descrição</th>
          <th style="padding:6px 10px;text-align:right">Realizado</th>
          ${comEst ? '<th style="padding:6px 10px;text-align:right">Estimativa</th><th style="padding:6px 10px;text-align:right">%</th><th style="padding:6px 10px">Status</th>'
                   : '<th style="padding:6px 10px">Situação</th>'}
        </tr>
        ${itens.map(x => {
          const est = Number(x.estimativa || 0);
          const pc = x.percentual != null ? Number(x.percentual) : (est > 0 ? 100 * Number(x.realizado) / est : null);
          return `<tr>
            <td style="${cel};font-family:monospace">${escapeHtml(x.tabela || '')}</td>
            <td style="${cel}">${escapeHtml(x.descricao || '—')}</td>
            <td style="${cel};text-align:right">${fmtNum(x.realizado)}</td>
            ${comEst ? `<td style="${cel};text-align:right">${est > 0 ? fmtNum(est) : '—'}</td>
              <td style="${cel};text-align:right;font-weight:600">${pc === null ? '—' : pc.toFixed(1) + '%'}</td>
              <td style="${cel}">${escapeHtml(x.status || '—')}</td>`
              : `<td style="${cel};color:${Number(x.realizado) > 0 ? '#047857' : C.cinza}">${Number(x.realizado) > 0 ? 'Com carga' : 'Zerada'}</td>`}
          </tr>`;
        }).join('')}
      </table>`;
  }).join('');

  const aviso = comEst ? '' : `
    <p style="background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:10px 14px;font-size:13px">
      <b>Sem estimativa cadastrada.</b> Os números são a contagem absoluta da última medição —
      não há % de carga nem semáforo.</p>`;

  return `<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8">
<title>Status dos Cadastros · ${escapeHtml(cliente)}</title></head>
<body style="margin:0;padding:24px;background:#E6E6E6;font-family:Inter,'Segoe UI',system-ui,sans-serif;color:${C.petroleo}">
<div style="max-width:900px;margin:0 auto;background:#fff;border-radius:10px;padding:24px">
  <p style="margin:0;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#0891b2;font-weight:700">${escapeHtml(cliente)}</p>
  <h1 style="margin:4px 0 2px;font-size:22px">Status dos Cadastros</h1>
  <p style="margin:0;color:${C.cinza};font-size:13px">
    ${escapeHtml(p.projeto || 'Monitoramento de Cadastros')} ·
    última medição ${fmtData(String(j.ultima_medicao || ''))} · ${j.total_medicoes} medição(ões)</p>
  ${aviso}
  <table style="width:100%;border-collapse:separate;margin:16px 0"><tr>${kpis}</tr></table>

  <h2 style="font-size:15px;margin:22px 0 4px">Registros por módulo</h2>
  <table style="width:100%;border-collapse:collapse">${blocoMod}</table>

  <h2 style="font-size:15px;margin:22px 0 4px">Evolução por medição</h2>
  <table style="width:100%;border-collapse:collapse">${hist}</table>

  <h2 style="font-size:15px;margin:22px 0 4px">Tabelas monitoradas</h2>
  ${detalhe}

  <p style="margin-top:24px;color:#9C9C9C;font-size:11px">
    Gerado pela Gestão de Projetos TOTVS SC em ${new Date().toLocaleString('pt-BR')}.</p>
</div></body></html>`;
}

// ============================================================================
//  CADASTROS — script SQL que levanta a contagem no banco do Protheus
//  Mesmo padrão do job MONITCAD: COUNT(*) por tabela com D_E_L_E_T_=' '.
//  O resultado sai no layout do CSV que a própria aba importa.
// ============================================================================
// Conjunto núcleo de implantação — usado quando o cliente ainda não tem medição
const PADRAO_MONITCAD = [
  ['Compras', 'SA2', 'Fornecedores'], ['Compras', 'SA5', 'Amarracao Produto x Fornecedor'],
  ['Compras', 'SC1', 'Solicitacao de Compra'], ['Compras', 'SC7', 'Pedido de Compra'],
  ['Compras', 'SC8', 'Cotacoes'],
  ['Configurador', 'SAH', 'Unidades de Medida'], ['Configurador', 'SM2', 'Moedas'],
  ['Configurador', 'SX5', 'Tabelas Genericas'], ['Configurador', 'SX6', 'Parametros do Sistema'],
  ['Configurador', 'SX7', 'Gatilhos'],
  ['Contabilidade', 'CT1', 'Plano de Contas'], ['Contabilidade', 'CT5', 'Lancamentos Padrao'],
  ['Contabilidade', 'CTD', 'Itens Contabeis'], ['Contabilidade', 'CTH', 'Classes de Valor'],
  ['Contabilidade', 'CTT', 'Centro de Custo / Unidade Negocio'],
  ['Contabilidade', 'CV3', 'Saldos Contabeis'],
  ['Contratos', 'CN9', 'Contratos (cabecalho)'],
  ['Estoque', 'NNR', 'Locais de Estoque'], ['Estoque', 'SB1', 'Cadastro de Produto'],
  ['Estoque', 'SBM', 'Grupos de Produto'],
  ['Faturamento', 'DA1', 'Tabelas de Preco (itens)'], ['Faturamento', 'SA1', 'Clientes'],
  ['Faturamento', 'SA3', 'Vendedores'], ['Faturamento', 'SA4', 'Transportadoras'],
  ['Faturamento', 'SC5', 'Pedido de Venda (cabecalho)'], ['Faturamento', 'SC6', 'Pedido de Venda (itens)'],
  ['Financeiro', 'SA6', 'Bancos'], ['Financeiro', 'SE1', 'Contas a Receber'],
  ['Financeiro', 'SE2', 'Contas a Pagar'], ['Financeiro', 'SE4', 'Condicoes de Pagamento'],
  ['Financeiro', 'SED', 'Naturezas Financeiras'], ['Financeiro', 'SF1', 'Cabecalho NF Entrada'],
  ['Financeiro', 'SD1', 'Itens NF Entrada'], ['Financeiro', 'SF2', 'Cabecalho NF Saida'],
  ['Fiscal', 'SD2', 'Itens NF Saida'], ['Fiscal', 'SF3', 'Livros Fiscais'],
  ['Fiscal', 'SF4', 'Tipos de Entrada e Saida (TES)'],
  ['PCP', 'SG1', 'Estrutura de Produto'], ['RH', 'SRA', 'Funcionarios'],
  ['Servico', 'AA1', 'Atendentes'], ['Loja', 'SL1', 'Venda Frente de Loja'],
];

const sqlTxt = (s) => `'${String(s ?? '').replace(/'/g, "''")}'`;

function montaScriptSQL(tipo, sufixo, dialeto, ini, fim) {
  const movimentos = tipo === 'movimentos';
  const daMedicao = movimentos
    ? (mov.dados?.itens || []).map(t => [t.modulo || '(sem módulo)', t.tabela, t.descricao || '', t.filtro || ''])
    : (cad.dados?.tabelas || []).map(t => [t.modulo || '(sem módulo)', t.tabela, t.descricao || '', t.filtro || '']);
  const padrao = movimentos ? PADRAO_MOVIMENTOS : PADRAO_MONITCAD.map(x => [...x, '']);
  const linhas = daMedicao.length ? daMedicao : padrao;
  const cliente = (state.selected?.projeto?.nome_cliente_projeto || '').trim();
  const ambiente = movimentos ? mov.ambiente : cad.ambiente;

  const oracle = dialeto === 'oracle';
  const agora = oracle ? `TO_CHAR(SYSDATE,'YYYY-MM-DD HH24:MI')`
                       : `CONVERT(varchar(16), GETDATE(), 120)`;
  const semana = oracle ? `TO_CHAR(SYSDATE,'IYYY')||'-W'||TO_CHAR(SYSDATE,'IW')`
                        : `CONCAT(DATEPART(year, GETDATE()), '-W', FORMAT(DATEPART(ISO_WEEK, GETDATE()), '00'))`;
  // No Protheus a data é char AAAAMMDD — comparação direta com string funciona
  const p1 = (ini || '').replace(/-/g, ''), p2 = (fim || '').replace(/-/g, '');

  const selects = linhas.map(([mod, tab, desc, quarto]) => {
    const fisica = `${tab}${sufixo}`;
    let where = `WHERE D_E_L_E_T_=' '`;
    if (movimentos) {
      // no conjunto de movimentos o 4º campo é a COLUNA DE DATA do documento
      if (quarto && p1 && p2) where += `\n   AND ${quarto} BETWEEN '${p1}' AND '${p2}'`;
    } else if (quarto) {
      where += ` AND ${quarto}`;
    }
    const periodo = movimentos ? `, ${sqlTxt(p1 && p2 ? `${p1}-${p2}` : 'total')} AS PERIODO` : '';
    return `SELECT ${sqlTxt(mod)} AS MODULO, ${sqlTxt(tab)} AS TABELA, ${sqlTxt(desc)} AS DESCRICAO,
       ${agora} AS DT_LEITURA, ${semana} AS SEMANA, COUNT(*) AS QTDE${periodo}
  FROM ${fisica} ${where}`;
  });

  const semData = movimentos ? linhas.filter(l => !l[3]).map(l => l[1]) : [];

  return `-- ===========================================================================
-- ${movimentos ? 'Volume de MOVIMENTOS' : 'Monitoramento de CADASTROS'}${cliente ? ' · ' + cliente : ''}
-- Ambiente de destino: ${AMB[ambiente].label.toUpperCase()}
-- Gerado pela Gestão de Projetos TOTVS SC em ${new Date().toLocaleString('pt-BR')}
--
-- Rode no banco do Protheus (${oracle ? 'Oracle' : 'SQL Server'}) e exporte o
-- resultado em CSV.${movimentos
  ? ' A importação de movimentos ainda não tem layout definido.'
  : ' Depois suba o arquivo em "⬆ Subir medição".'}
--
-- ATENÇÃO: rode na base ${AMB[ambiente].label.toUpperCase()}. Produção e teste têm
-- séries separadas no painel — o arquivo trocado polui a leitura do projeto.
--
-- Sufixo das tabelas: ${sufixo}  (ex.: SA1 → SA1${sufixo}). Troque se a empresa
-- ou o grupo for outro. Mesma regra do job MONITCAD: D_E_L_E_T_=' '.
${movimentos && p1 && p2 ? `-- Período: ${p1} a ${p2} (data do documento, char AAAAMMDD).` : ''}
${semData.length ? `-- Sem coluna de data (contam o total, não o período): ${semData.join(', ')}.` : ''}
${daMedicao.length
  ? `-- Tabelas: as ${linhas.length} da última medição deste cliente/ambiente.`
  : `-- Tabelas: conjunto núcleo (${linhas.length}) — ainda não há medição neste
--          ambiente. Ajuste conforme o escopo do cliente.`}
-- ===========================================================================

${selects.join('\nUNION ALL\n')}
ORDER BY 1, 2;
`;
}

function abreModalSQL(tipo = 'cadastros') {
  const movimentos = tipo === 'movimentos';
  const hoje = new Date();
  const iso = (d) => d.toISOString().slice(0, 10);
  const mesIni = iso(new Date(hoje.getFullYear(), hoje.getMonth(), 1));

  const m = modal(`Script SQL · ${movimentos ? 'volume de movimentos' : 'contagem de cadastros'}`,
    `<div class="grid grid-cols-2 gap-3">
       ${campo('sql-sufixo', 'Sufixo das tabelas', '010', 'text', 'Ex.: SA1 + 010 = SA1010')}
       <label class="block"><span class="text-xs text-slate-500">Banco</span>
         <select id="sql-dialeto" class="mt-1 w-full px-3 py-2 border border-slate-300 rounded-md">
           <option value="mssql">SQL Server</option>
           <option value="oracle">Oracle</option>
         </select></label>
     </div>
     ${movimentos ? `<div class="grid grid-cols-2 gap-3">
       ${campo('sql-ini', 'Período de', mesIni, 'date')}
       ${campo('sql-fim', 'até', iso(hoje), 'date')}</div>` : ''}
     <p class="text-xs text-slate-500">Rode na
       <b>${AMB[movimentos ? mov.ambiente : cad.ambiente].label}</b> — é a base da aba aberta.
       ${movimentos ? 'O período filtra pela data do documento.' : 'Exporte em CSV e suba em "⬆ Subir medição".'}</p>
     <textarea id="sql-txt" rows="14" readonly
       class="w-full px-3 py-2 border border-slate-300 rounded-md font-mono text-xs bg-slate-50"></textarea>
     <div class="flex gap-2">
       <button id="sql-copiar" class="px-3 py-1.5 rounded-md border border-slate-300 hover:bg-slate-50 text-sm">Copiar</button>
       <button id="sql-baixar" class="px-3 py-1.5 rounded-md border border-slate-300 hover:bg-slate-50 text-sm">Baixar .sql</button>
       <span id="sql-msg" class="text-xs text-emerald-700 self-center"></span>
     </div>`,
    'Fechar');

  const gera = () => {
    m.campo('sql-txt').value = montaScriptSQL(
      tipo, m.campo('sql-sufixo').value.trim() || '010', m.campo('sql-dialeto').value,
      movimentos ? m.campo('sql-ini').value : '', movimentos ? m.campo('sql-fim').value : '');
  };
  gera();
  ['sql-sufixo', 'sql-dialeto', 'sql-ini', 'sql-fim'].forEach(id =>
    m.campo(id)?.addEventListener('input', gera));
  m.aoConfirmar(m.fecha);

  m.campo('sql-copiar').addEventListener('click', async () => {
    const txt = m.campo('sql-txt').value;
    try { await navigator.clipboard.writeText(txt); }
    catch { m.campo('sql-txt').select(); document.execCommand('copy'); }
    m.campo('sql-msg').textContent = 'Copiado.';
  });
  m.campo('sql-baixar').addEventListener('click', () => {
    const url = URL.createObjectURL(new Blob([m.campo('sql-txt').value], { type: 'text/plain;charset=utf-8' }));
    const a = Object.assign(document.createElement('a'), {
      href: url, download: `monitcad-${(cad.customer || 'cliente').toLowerCase()}.sql` });
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  });
}

function modal(titulo, corpoHTML, rotuloOk) {
  const fundo = document.createElement('div');
  fundo.className = 'fixed inset-0 z-50 bg-black/40 flex items-start justify-center p-6 overflow-y-auto';
  fundo.innerHTML = `
    <div class="bg-white rounded-lg shadow-xl w-full max-w-lg mt-16">
      <div class="px-5 py-3 border-b border-slate-200 flex items-center justify-between">
        <h3 class="font-totvs text-totvs-petroleo">${titulo}</h3>
        <button data-fechar class="text-slate-400 hover:text-slate-700 text-xl leading-none">×</button>
      </div>
      <div class="p-5 space-y-3 text-sm">${corpoHTML}</div>
      <div class="px-5 py-3 border-t border-slate-200 flex items-center justify-end gap-2">
        <p data-erro class="mr-auto text-xs text-rose-600"></p>
        <button data-fechar class="px-3 py-1.5 rounded-md border border-slate-300 hover:bg-slate-50">Cancelar</button>
        <button data-ok class="px-3 py-1.5 rounded-md bg-totvs-blue text-totvs-petroleo font-semibold hover:bg-totvs-verde">${rotuloOk}</button>
      </div>
    </div>`;
  document.body.appendChild(fundo);
  const fecha = () => fundo.remove();
  fundo.querySelectorAll('[data-fechar]').forEach(b => b.addEventListener('click', fecha));
  fundo.addEventListener('click', e => { if (e.target === fundo) fecha(); });
  return {
    el: fundo, fecha,
    campo: (id) => fundo.querySelector(`#${id}`),
    erro: (msg) => { fundo.querySelector('[data-erro]').textContent = msg || ''; },
    aoConfirmar: (fn) => fundo.querySelector('[data-ok]').addEventListener('click', fn),
    ocupado: (v, txt) => {
      const b = fundo.querySelector('[data-ok]');
      b.disabled = v;
      b.textContent = txt;
    },
  };
}

const campo = (id, rot, valor = '', tipo = 'text', dica = '') => `
  <label class="block">
    <span class="text-xs text-slate-500">${rot}</span>
    <input id="${id}" type="${tipo}" value="${escapeHtml(valor)}"
           class="mt-1 w-full px-3 py-2 border border-slate-300 rounded-md focus:outline-none focus:ring-2 focus:ring-totvs-blue/40">
    ${dica ? `<span class="text-xs text-slate-400">${dica}</span>` : ''}
  </label>`;

function abreModalEmail() {
  const html = relatorioCadastrosHTML();
  if (!html) { alert('Não há medição para enviar.'); return; }
  const j = cad.dados;
  const cliente = (state.selected?.projeto?.nome_cliente_projeto || j.projeto?.cliente_nome || '').trim();
  const assunto = `Status dos Cadastros · ${cliente} · ${fmtData(String(j.ultima_medicao || ''))}`;

  const m = modal('Criar rascunho no Gmail',
    campo('em-para', 'Para (separe por vírgula)') +
    campo('em-cc', 'Cc (opcional)') +
    campo('em-assunto', 'Assunto', assunto) +
    `<p class="text-xs text-slate-500">O corpo vai com o relatório completo: KPIs, registros por
     módulo, evolução por medição e todas as tabelas. O rascunho é criado na sua conta —
     nada é enviado.</p>`,
    'Criar rascunho');

  m.aoConfirmar(async () => {
    const dados = {
      para: m.campo('em-para').value.trim(),
      cc: m.campo('em-cc').value.trim(),
      assunto: m.campo('em-assunto').value.trim(),
      html,
    };
    if (!dados.assunto) { m.erro('Informe o assunto.'); return; }
    m.erro(''); m.ocupado(true, 'Criando…');
    try {
      const r = await api('/api/gmail/rascunho', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(dados),
      });
      m.fecha();
      alert(`Rascunho criado em ${r.gmail_email}. Abra o Gmail em Rascunhos.`);
    } catch (e) {
      m.ocupado(false, 'Criar rascunho');
      if (e.status === 428) { m.fecha(); abreModalCredGmail(() => abreModalEmail()); return; }
      m.erro(e.message);
    }
  });
}

function abreModalCredGmail(depois) {
  const m = modal('Conectar o Gmail',
    `<p class="text-xs text-slate-500">Para criar rascunhos, o app precisa de uma
     <b>App Password</b> do Google (não é a sua senha normal). Gere em
     <span class="font-mono">myaccount.google.com → Segurança → Senhas de app</span>.
     Ela é guardada cifrada e nunca volta para a tela.</p>` +
    campo('gc-email', 'E-mail do Gmail', '', 'email') +
    campo('gc-senha', 'App Password (16 caracteres)', '', 'password', 'Os espaços são ignorados.'),
    'Salvar e testar');

  m.aoConfirmar(async () => {
    const dados = {
      gmail_email: m.campo('gc-email').value.trim(),
      app_password: m.campo('gc-senha').value,
    };
    if (!dados.gmail_email || !dados.app_password) { m.erro('Preencha os dois campos.'); return; }
    m.erro(''); m.ocupado(true, 'Testando no Gmail…');
    try {
      await api('/api/gmail/cred', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(dados),
      });
      m.fecha();
      if (depois) depois();
    } catch (e) {
      m.ocupado(false, 'Salvar e testar');
      m.erro(e.message);
    }
  });
}
