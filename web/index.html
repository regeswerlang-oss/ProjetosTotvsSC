<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Projetos · TOTVS SC</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  // Paleta e tipografia oficiais TOTVS (https://marca.totvs.com/)
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          totvs: {
            blue: '#00DBFF', purple: '#A44DFF', petroleo: '#002233',
            verde: '#00FFD4', limao: '#D9FF65', laranja: '#FF8900', rosa: '#FF009E',
            yellow: '#FFB800', black: '#002B33', gray: '#545454',
            graylight: '#9C9C9C', white: '#ECECEC', beige: '#E6E6E6',
          },
        },
        fontFamily: {
          totvs: ['TOTVS', 'Inter', 'Segoe UI', 'system-ui', 'sans-serif'],
        },
      },
    },
  };
</script>
<style>
  /* Fonte oficial TOTVS — só peso Bold, reservada a títulos/destaques */
  @font-face {
    font-family: 'TOTVS';
    src: url('assets/fonte/TOTVS-Bold.ttf') format('truetype');
    font-weight: 700; font-style: normal; font-display: swap;
  }
  :root {
    --totvs-blue: #00DBFF; --totvs-purple: #A44DFF; --totvs-petroleo: #002233;
    --totvs-verde: #00FFD4; --totvs-gradient: linear-gradient(135deg, #00DBFF, #A44DFF);
  }
  body { font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif; }
  .font-totvs { font-family: 'TOTVS', 'Inter', sans-serif; font-weight: 700; letter-spacing: -0.01em; }

  .bar-track { background: #e6edf0; height: 0.5rem; border-radius: 999px; overflow: hidden; position: relative; }
  .bar-fill { height: 100%; border-radius: 999px; }
  /* Barras de progresso — Executado (Blue) sobre Planejado (Purple claro) */
  .fill-exec { background: var(--totvs-blue); }
  .fill-plan { background: #d8bdff; }

  details > summary { list-style: none; cursor: pointer; }
  details > summary::-webkit-details-marker { display: none; }
  details > summary .chev { transition: transform 0.15s; display: inline-block; }
  details[open] > summary .chev { transform: rotate(90deg); }

  /* Grafismo institucional de hexágonos TOTVS — sutil, atrás do conteúdo */
  .totvs-hex { position: relative; overflow: hidden; }
  .totvs-hex::after {
    content: ''; position: absolute; inset: 0; pointer-events: none;
    background-image: url('assets/grafismos/hexagonos-3d.svg');
    background-repeat: no-repeat; background-position: right -40px center;
    background-size: auto 240%;
    opacity: 0.10;
  }
  .totvs-hex > * { position: relative; z-index: 1; }

  /* Altura real do header — medida por ResizeObserver e usada pelo sticky das abas */
  :root { --hdr: 68px; }
  #app-tabs { top: var(--hdr); }
  .app-tab { padding: 0.75rem 1rem; font-size: 0.875rem; border-bottom: 2px solid transparent;
             color: #545454; font-weight: 500; }
  .app-tab:hover { color: var(--totvs-petroleo); }
  .app-tab.is-active { border-bottom-color: var(--totvs-blue); color: var(--totvs-petroleo); font-weight: 700; }
  #frame-transicao { width: 100%; border: 0; display: block; min-height: 70vh; }
</style>
</head>
<body class="bg-totvs-beige text-totvs-petroleo">

<header class="bg-totvs-petroleo text-totvs-white sticky top-0 z-10 shadow-sm totvs-hex">
  <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between gap-4">
    <div class="flex items-center gap-4">
      <span id="nav-back" class="hidden cursor-pointer text-totvs-graylight hover:text-totvs-blue text-xl leading-none">←</span>
      <img src="assets/logos/logo-totvs-branco.svg" alt="TOTVS" class="h-7 w-auto select-none" draggable="false">
      <div class="border-l border-white/15 pl-4">
        <h1 class="font-totvs text-lg text-white leading-tight">Gestão de Projetos</h1>
        <p id="subtitle" class="text-xs text-totvs-graylight mt-0.5">Carregando…</p>
      </div>
    </div>
    <div class="flex items-center gap-4 text-xs">
      <label class="flex items-center gap-1.5 text-totvs-white/80 cursor-pointer" style="display:none">
        <input type="checkbox" id="toggle-all" class="rounded accent-totvs-blue">
        Mostrar todos os clientes
      </label>
      <select id="view-as" title="Ver o dashboard com a visão de outro usuário"
              class="hidden px-2 py-1.5 rounded-md bg-white/10 text-totvs-white text-xs border border-white/20">
        <option value="">👁 Ver como…</option>
      </select>
      <button id="btn-sync" class="px-3 py-1.5 rounded-md bg-white/10 text-totvs-white font-semibold hover:bg-white/20 transition-colors" title="Busca os projetos na API PCI e atualiza a base">⟳ Sincronizar API</button>
      <button id="btn-refresh" class="px-3 py-1.5 rounded-md bg-totvs-blue text-totvs-petroleo font-semibold hover:bg-totvs-verde transition-colors">↻ Atualizar</button>
    </div>
  </div>
</header>

<div id="simulando" class="hidden bg-amber-400 text-amber-950 px-6 py-2 text-sm font-semibold flex items-center gap-3">
  <span>👁</span>
  <span id="simulando-txt"></span>
  <button id="sair-simulacao" class="ml-auto px-3 py-1 rounded-md bg-amber-950 text-amber-50 text-xs font-bold hover:bg-amber-900">Sair da simulação</button>
</div>

<!-- Navegação global do app -->
<nav id="app-tabs" class="bg-white border-b border-slate-200 sticky z-[9] shadow-sm">
  <div class="max-w-7xl mx-auto px-6 flex gap-1">
    <button data-app="projetos"  class="app-tab is-active">Projetos</button>
    <button data-app="cadastros" class="app-tab">Cadastros</button>
    <button data-app="transicao" class="app-tab">Transição</button>
  </div>
</nav>

<main class="max-w-7xl mx-auto px-6 py-6">
  <!-- VIEW 1: LISTA -->
  <section id="view-lista">
    <div id="filtro-bar" class="mb-4 flex items-center gap-3 flex-wrap text-sm">
      <input id="busca" type="search" placeholder="Buscar projeto, cliente ou coordenador…"
             class="flex-1 min-w-[280px] px-3 py-2 border border-slate-300 rounded-md bg-white focus:outline-none focus:ring-2 focus:ring-totvs-blue/40">
      <select id="filtro-status" class="px-3 py-2 border border-slate-300 rounded-md bg-white">
        <option value="">Todos status</option>
      </select>
      <select id="filtro-tipo" class="px-3 py-2 border border-slate-300 rounded-md bg-white">
        <option value="">Todos tipos</option>
      </select>
    </div>
    <div id="resumo" class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-5"></div>
    <div id="grupos" class="space-y-6"></div>
  </section>

  <!-- VIEW 2: DETALHE -->
  <section id="view-detalhe" class="hidden">
    <div id="detalhe-loading" class="text-center py-12 text-slate-400">Carregando projeto…</div>
    <div id="detalhe-conteudo" class="hidden">
      <!-- Cabeçalho -->
      <div class="bg-white rounded-lg border border-slate-200 p-5 mb-4">
        <div class="flex items-start justify-between flex-wrap gap-3">
          <div>
            <p class="text-xs text-totvs-blue uppercase tracking-wide font-semibold" id="d-cliente"></p>
            <h2 class="text-xl font-totvs text-totvs-petroleo mt-0.5" id="d-titulo"></h2>
            <p class="text-sm text-slate-600 mt-1" id="d-codigo"></p>
          </div>
          <div class="flex flex-col items-end gap-2">
            <span id="d-status" class="px-3 py-1 rounded-full text-xs font-medium"></span>
            <p class="text-xs text-slate-500" id="d-contrato"></p>
          </div>
        </div>
        <div class="mt-4 grid grid-cols-2 md:grid-cols-4 gap-4 text-sm">
          <div><p class="text-xs text-slate-500">Coordenador</p><p class="font-medium" id="d-coord"></p></div>
          <div><p class="text-xs text-slate-500">Coord. Auxiliar</p><p class="font-medium" id="d-coord2"></p></div>
          <div><p class="text-xs text-slate-500">Vigência</p><p class="font-medium" id="d-vigencia"></p></div>
          <div><p class="text-xs text-slate-500">Tipo</p><p class="font-medium" id="d-tipo"></p></div>
        </div>
      </div>

      <!-- Tabs do projeto: Resumo | Cronograma | Por Módulo | Por Etapa
           A barra fica logo abaixo do card do projeto; KPIs e Apontamentos
           passaram a viver dentro da aba Resumo. -->
      <div class="bg-white rounded-lg border border-slate-200">
        <div class="flex items-center justify-between px-5 pt-4 border-b border-slate-200">
          <div class="flex gap-1 -mb-px">
            <button data-tab="resumo"   class="tab-btn px-4 py-2 text-sm border-b-2 border-totvs-blue text-totvs-petroleo font-semibold">Resumo</button>
            <button data-tab="crono"    class="tab-btn px-4 py-2 text-sm border-b-2 border-transparent text-slate-500 hover:text-slate-700">Cronograma</button>
            <button data-tab="modulos"  class="tab-btn px-4 py-2 text-sm border-b-2 border-transparent text-slate-500 hover:text-slate-700">Por Módulo</button>
            <button data-tab="etapas"   class="tab-btn px-4 py-2 text-sm border-b-2 border-transparent text-slate-500 hover:text-slate-700">Por Etapa</button>
          </div>
          <div id="tab-acoes" class="flex items-center gap-2 text-xs pb-2 hidden">
            <button data-act="expand-all" class="px-2 py-1 rounded border border-slate-300 hover:bg-slate-50">Expandir</button>
            <button data-act="collapse-all" class="px-2 py-1 rounded border border-slate-300 hover:bg-slate-50">Recolher</button>
          </div>
        </div>

        <!-- Aba Resumo (KPIs + Apontamentos por tipo) -->
        <div id="tab-resumo" class="p-5">
          <div id="d-kpis" class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-5"></div>
          <h3 class="text-sm font-semibold text-slate-700 mb-3">Apontamentos por tipo</h3>
          <div id="d-horas" class="space-y-2"></div>
        </div>

        <!-- Aba Cronograma (existente) -->
        <div id="tab-crono" class="p-5 hidden">
          <div id="d-crono-loading" class="text-slate-400 text-sm py-4">Carregando cronograma…</div>
          <div id="d-crono"></div>
        </div>

        <!-- Aba Por Módulo (novo) -->
        <div id="tab-modulos" class="p-5 hidden">
          <div id="d-modulos-loading" class="text-slate-400 text-sm py-4">Carregando…</div>
          <div id="d-modulos"></div>
        </div>

        <!-- Aba Por Etapa (novo) -->
        <div id="tab-etapas" class="p-5 hidden">
          <div id="d-etapas-loading" class="text-slate-400 text-sm py-4">Carregando…</div>
          <div id="d-etapas"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- VIEW 3: CADASTROS (MONITCAD) -->
  <section id="view-cadastros" class="hidden">
    <div class="mb-4 flex items-center gap-3 flex-wrap text-sm">
      <select id="cad-cliente" class="px-3 py-2 border border-slate-300 rounded-md bg-white min-w-[280px]">
        <option value="">Selecione o cliente…</option>
      </select>
      <button id="cad-reload" class="px-3 py-2 rounded-md border border-slate-300 bg-white hover:bg-slate-50">↻ Atualizar</button>
      <label id="cad-upload-wrap" class="ml-auto px-3 py-2 rounded-md bg-totvs-blue text-totvs-petroleo font-semibold cursor-pointer hover:bg-totvs-verde">
        ⬆ Subir medição (.json)
        <input id="cad-file" type="file" accept="application/json" class="hidden">
      </label>
    </div>
    <div id="cad-conteudo"></div>
  </section>

  <!-- VIEW 4: TRANSIÇÃO (painel de status entregue ao cliente) -->
  <section id="view-transicao" class="hidden">
    <div class="mb-4 flex items-center gap-3 flex-wrap text-sm">
      <select id="tr-painel" class="px-3 py-2 border border-slate-300 rounded-md bg-white min-w-[380px]">
        <option value="">Selecione o painel…</option>
      </select>
      <span id="tr-info" class="text-xs text-slate-500"></span>
      <label id="tr-upload-wrap" class="hidden ml-auto px-3 py-2 rounded-md bg-totvs-blue text-totvs-petroleo font-semibold cursor-pointer hover:bg-totvs-verde">
        ⬆ Publicar painel (.html)
        <input id="tr-file" type="file" accept="text/html" class="hidden">
      </label>
    </div>
    <div id="tr-conteudo"></div>
    <div id="transicao-box" class="hidden bg-white rounded-lg border border-slate-200 overflow-hidden">
      <iframe id="frame-transicao" title="Painel de status do cliente" loading="lazy"></iframe>
    </div>
  </section>
</main>

<script>
// ============================================================================
//  STATE
// ============================================================================
const state = {
  projetos: [],
  clientes: [],
  app: 'projetos',                     // 'projetos' | 'cadastros' | 'transicao'
  view: 'lista',                       // 'lista' | 'detalhe'
  selected: null,                      // { cli, cod, ver, loja, projeto }
  showAll: false,
  cronograma: null,                    // último cronograma carregado
  tab: 'resumo',                       // 'resumo' | 'crono' | 'modulos' | 'etapas'
};

// Mapeamentos de status — PALPITES (ajustar conforme uso real)
const STATUS_PROJETO_CLASS = {
  'Em Execução':   'bg-emerald-100 text-emerald-700',
  'Em Andamento':  'bg-emerald-100 text-emerald-700',
  'Bloqueado':     'bg-amber-100 text-amber-700',
  'Concluido':     'bg-blue-100 text-blue-700',
  'Concluído':     'bg-blue-100 text-blue-700',
  'Cancelado':     'bg-rose-100 text-rose-700',
};

const STATUS_IBL = {
  'BM': { label: 'Bloqueado', cls: 'bg-amber-100 text-amber-700' },
  'EX': { label: 'Em Execução', cls: 'bg-emerald-100 text-emerald-700' },
  'EN': { label: 'Encerrado', cls: 'bg-blue-100 text-blue-700' },
};

// Status de etapa (na árvore de cronograma)
const STATUS_IMPLANTACAO = {
  'I':  { label: 'Em Implantação', cls: 'bg-blue-100 text-blue-700' },
  'BM': { label: 'Bloqueado',      cls: 'bg-amber-100 text-amber-700' },
  ' ':  { label: 'Aberto',         cls: 'bg-slate-100 text-slate-600' },
  '':   { label: 'Aberto',         cls: 'bg-slate-100 text-slate-600' },
  'C':  { label: 'Concluído',      cls: 'bg-emerald-100 text-emerald-700' },
};
const STATUS_OBJETIVO = {
  'C':  { label: 'Concluído',      cls: 'bg-emerald-100 text-emerald-700' },
  '':   { label: '—',              cls: 'bg-slate-100 text-slate-500' },
};

// Status de agenda
const STATUS_AGENDA = {
  'ZA': { label: 'Apontado',  cls: 'bg-emerald-50 text-emerald-700 border-emerald-200' },
  'ZV': { label: 'Cancelado', cls: 'bg-rose-50 text-rose-700 border-rose-200' },
  'C':  { label: 'Confirmado',cls: 'bg-blue-50 text-blue-700 border-blue-200' },
  'P':  { label: 'Planejado', cls: 'bg-slate-50 text-slate-700 border-slate-200' },
  'S':  { label: 'Em Espera', cls: 'bg-amber-50 text-amber-700 border-amber-200' },
};

// ============================================================================
//  UTIL
// ============================================================================
const $ = (sel) => document.querySelector(sel);
const $$ = (sel) => Array.from(document.querySelectorAll(sel));

function fmtPct(v) {
  if (v === null || v === undefined || isNaN(v)) return '—';
  return `${Math.round(v)}%`;
}
function fmtH(v) {
  if (v === null || v === undefined || isNaN(v)) return '—';
  return Number(v).toLocaleString('pt-BR', { maximumFractionDigits: 1 });
}
function fmtData(s) {
  if (!s) return '—';
  // dd/mm/aaaa já vem formatado; "YYYY-MM-DD" vira pt-BR
  if (/^\d{4}-\d{2}-\d{2}$/.test(s)) {
    const [y,m,d] = s.split('-');
    return `${d}/${m}/${y}`;
  }
  return s.trim();
}
async function api(path, opts) {
  const r = await fetch(path, opts);
  if (r.status === 401) { location.href = '/login'; throw new Error('Sessão expirada'); }
  if (!r.ok) {
    // Tenta extrair a mensagem amigável do corpo JSON ({error: "..."})
    let msg = `HTTP ${r.status}`;
    try {
      const body = await r.json();
      if (body && body.error) msg = body.error;
    } catch (_) { /* corpo não-JSON, mantém o HTTP nnn */ }
    throw new Error(msg);
  }
  return r.json();
}
function classStatus(map, key, fallback = 'bg-slate-100 text-slate-700') {
  return (map[key] && (map[key].cls || map[key])) || fallback;
}

// ============================================================================
//  VIEW: LISTA
// ============================================================================
async function carregaLista() {
  $('#subtitle').textContent = 'Buscando projetos…';
  $('#grupos').innerHTML = '<div class="text-center py-12 text-slate-400">Carregando…</div>';
  $('#resumo').innerHTML = '';
  try {
    const url = '/api/projetos' + (state.showAll ? '?all=1' : '');
    const data = await api(url);
    state.projetos = data.projetos || [];
    populaFiltros();
    renderResumo();
    renderGrupos();
    $('#subtitle').textContent = `${state.projetos.length} projeto(s)` + (data.sincronizado_em ? ` · base de ${fmtData(String(data.sincronizado_em).slice(0,10).replace(/-/g,''))}` : '');
  } catch (e) {
    $('#grupos').innerHTML = `<div class="text-rose-600 p-4 bg-rose-50 rounded">Erro: ${e.message}</div>`;
  }
}

function populaFiltros() {
  const sel  = $('#filtro-status');
  const selT = $('#filtro-tipo');
  const stAnterior = sel.value;      // preserva escolha do usuário entre Atualizar
  const tpAnterior = selT.value;

  const status = [...new Set(state.projetos.map(p => p.status_projeto).filter(Boolean))].sort();
  sel.innerHTML  = '<option value="">Todos status</option>' + status.map(s => `<option>${s}</option>`).join('');

  const tipos  = [...new Set(state.projetos.map(p => p.tipo_projeto).filter(Boolean))].sort();
  selT.innerHTML = '<option value="">Todos tipos</option>' + tipos.map(s => `<option>${s}</option>`).join('');

  // Filtros padrão na primeira carga: "Em Execução" + "Implantação".
  // Em recargas posteriores, mantém o que o usuário tiver escolhido.
  if (!state.filtrosInicializados) {
    if (status.includes('Em Execução')) sel.value  = 'Em Execução';
    if (tipos.includes('Implantação'))  selT.value = 'Implantação';
    state.filtrosInicializados = true;
  } else {
    sel.value  = stAnterior;
    selT.value = tpAnterior;
  }
}

function aplicarFiltros() {
  const q = $('#busca').value.trim().toLowerCase();
  const st = $('#filtro-status').value;
  const tp = $('#filtro-tipo').value;
  return state.projetos.filter(p => {
    if (st && p.status_projeto !== st) return false;
    if (tp && p.tipo_projeto !== tp) return false;
    if (q) {
      const blob = `${p.codigo_projeto} ${p.descricao_projeto} ${p.nome_cliente_projeto} ${p.nome_coordenador_projeto || ''}`.toLowerCase();
      if (!blob.includes(q)) return false;
    }
    return true;
  });
}

function renderResumo() {
  const filtrados = aplicarFiltros();
  const total = filtrados.length;
  const ativos = filtrados.filter(p => p.status_projeto === 'Em Execução').length;
  const bloqueados = filtrados.filter(p => p.status_projeto === 'Bloqueado').length;
  const clientes = new Set(filtrados.map(p => p.codigo_cliente_projeto)).size;
  $('#resumo').innerHTML = `
    ${kpi('Projetos', total, 'bg-totvs-petroleo text-white')}
    ${kpi('Em Execução', ativos, 'bg-totvs-blue text-totvs-petroleo')}
    ${kpi('Bloqueados', bloqueados, 'bg-totvs-yellow text-totvs-petroleo')}
    ${kpi('Clientes', clientes, 'bg-totvs-purple text-white')}
  `;
}
function kpi(label, valor, cls) {
  return `<div class="${cls} rounded-lg px-4 py-3">
    <p class="text-xs opacity-80">${label}</p>
    <p class="text-2xl font-totvs mt-0.5">${valor}</p>
  </div>`;
}

function renderGrupos() {
  const filtrados = aplicarFiltros();
  // agrupar por cliente
  const grupos = {};
  for (const p of filtrados) {
    const k = p.codigo_cliente_projeto;
    if (!grupos[k]) grupos[k] = { nome: p._nome_cliente_local || p.nome_cliente_projeto, codigo: k, projetos: [] };
    grupos[k].projetos.push(p);
  }
  const ordenado = Object.values(grupos).sort((a,b) => a.nome.localeCompare(b.nome));
  if (!ordenado.length) {
    $('#grupos').innerHTML = '<div class="text-center py-12 text-slate-400">Nenhum projeto.</div>';
    return;
  }
  $('#grupos').innerHTML = ordenado.map(g => `
    <details open class="bg-white rounded-lg border border-slate-200">
      <summary class="px-5 py-3 flex items-center justify-between border-b border-slate-100">
        <div>
          <span class="chev mr-2 text-slate-400">▶</span>
          <span class="font-semibold text-slate-900">${escapeHtml(g.nome)}</span>
          <span class="ml-2 text-xs text-slate-500">${g.codigo}</span>
        </div>
        <span class="text-xs text-slate-500">${g.projetos.length} projeto(s)</span>
      </summary>
      <div class="divide-y divide-slate-100">
        ${g.projetos.map(cardProjeto).join('')}
      </div>
    </details>
  `).join('');
  // bind clicks
  $$('#grupos [data-projeto]').forEach(el => {
    el.addEventListener('click', () => {
      const d = el.dataset;
      abrirDetalhe({
        cli: d.cli, cod: d.cod, ver: d.ver, loja: d.loja,
        projeto: state.projetos.find(p => p.codigo_projeto === d.cod),
      });
    });
  });
}

function cardProjeto(p) {
  const cls = STATUS_PROJETO_CLASS[p.status_projeto] || 'bg-slate-100 text-slate-700';
  return `
    <div data-projeto data-cli="${p.codigo_cliente_projeto}" data-cod="${p.codigo_projeto}"
         data-ver="${p.versao_projeto || ''}" data-loja="${(p.codigo_cliente_projeto || '').slice(-2)}"
         class="px-5 py-3 hover:bg-slate-50 cursor-pointer flex items-center justify-between gap-4">
      <div class="min-w-0 flex-1">
        <p class="font-medium text-slate-900 truncate">${escapeHtml(p.descricao_projeto || '—')}</p>
        <p class="text-xs text-slate-500 mt-0.5">
          <span class="font-mono">${p.codigo_projeto}</span> ·
          ${escapeHtml(p.tipo_projeto || '—')} ·
          ${escapeHtml(p.nome_coordenador_projeto || '—').trim()}
        </p>
      </div>
      <div class="flex items-center gap-3 shrink-0">
        <span class="px-2 py-0.5 rounded-full text-xs font-medium ${cls}">${p.status_projeto || '—'}</span>
        <span class="text-slate-400">›</span>
      </div>
    </div>`;
}

// ============================================================================
//  VIEW: DETALHE
// ============================================================================
async function abrirDetalhe(sel) {
  state.selected = sel;
  state.view = 'detalhe';
  setTab('resumo');                     // todo projeto abre pelo Resumo
  $('#view-lista').classList.add('hidden');
  $('#view-detalhe').classList.remove('hidden');
  $('#nav-back').classList.remove('hidden');
  $('#detalhe-loading').classList.remove('hidden');
  $('#detalhe-conteudo').classList.add('hidden');
  $('#d-crono').innerHTML = '';
  $('#d-crono-loading').classList.remove('hidden');
  window.scrollTo(0, 0);

  const { cli, cod, ver, loja, projeto } = sel;
  state.projHorasPrevistas = 0;   // reset — preenchido pelo /mapa deste projeto

  // URL-encode cada componente — clientes como "08872 00" têm espaço
  const enc = (s) => encodeURIComponent(s || '');
  const base = `/api/projeto/${enc(cli)}/${enc(cod)}/${enc(ver || '01')}/${enc(loja || 'undefined')}`;

  // 1) Mapa
  try {
    const mapa = await api(`${base}/mapa`);
    preencheMapa(mapa, projeto);
    $('#detalhe-loading').classList.add('hidden');
    $('#detalhe-conteudo').classList.remove('hidden');
  } catch (e) {
    $('#detalhe-loading').innerHTML = blocoErro('Não foi possível carregar o projeto', e, () => abrirDetalhe(sel));
    return;
  }

  // 2) Cronograma
  try {
    const crono = await api(`${base}/cronograma`);
    state.cronograma = crono;
    renderCronograma(crono);
    renderPorModulo(crono);
    renderPorEtapa(crono);
    $('#d-crono-loading').classList.add('hidden');
    $('#d-modulos-loading').classList.add('hidden');
    $('#d-etapas-loading').classList.add('hidden');
  } catch (e) {
    const html = blocoErro('Não foi possível carregar o cronograma', e, () => abrirDetalhe(sel));
    $('#d-crono-loading').innerHTML   = html;
    $('#d-modulos-loading').innerHTML = html;
    $('#d-etapas-loading').innerHTML  = html;
  }
}

// Bloco de erro amigável + botão "Tentar novamente"
function blocoErro(titulo, e, retry) {
  const msg = String(e?.message || e || '');
  // Detecta indisponibilidade (PCIUnavailable do backend → 503 + api_indisponivel)
  const indisp = /503|api_indisponivel|indispon|timed out|timeout|ConnectionError/i.test(msg);
  const hint = indisp
    ? 'A API da TOTVS está com soluço momentâneo. Geralmente normaliza em alguns segundos.'
    : 'Tente novamente em instantes.';
  const id = 'retry-' + Math.random().toString(36).slice(2, 8);
  setTimeout(() => {
    const btn = document.getElementById(id);
    if (btn) btn.addEventListener('click', retry);
  }, 0);
  return `<div class="bg-white border border-totvs-yellow/30 rounded-lg p-6 max-w-xl mx-auto text-left">
    <div class="flex items-start gap-3">
      <span class="text-totvs-yellow text-2xl leading-none">⚠</span>
      <div class="flex-1">
        <p class="font-semibold text-totvs-petroleo">${escapeHtml(titulo)}</p>
        <p class="text-sm text-totvs-gray mt-1">${hint}</p>
        <details class="mt-2 text-xs text-totvs-graylight">
          <summary class="cursor-pointer hover:text-totvs-gray">Detalhes técnicos</summary>
          <pre class="mt-1 whitespace-pre-wrap break-words">${escapeHtml(msg)}</pre>
        </details>
        <button id="${id}" class="mt-3 px-3 py-1.5 rounded-md bg-totvs-blue text-totvs-petroleo font-semibold hover:bg-totvs-verde text-sm">↻ Tentar novamente</button>
      </div>
    </div>
  </div>`;
}

function voltarLista() {

function preencheMapa(m, projeto) {
  // Aviso de dados vindos do cache (API estava fora quando recarregou)
  if (m._stale) {
    $('#subtitle').textContent = `⚠ Dados de ~${m._stale_idade_min || 0} min atrás — API Totvs SC instável`;
    $('#subtitle').className = 'text-xs text-amber-600 mt-0.5 font-medium';
  } else {
    $('#subtitle').className = 'text-xs text-slate-500 mt-0.5';
  }
  // HORAS_PREVISTAS do projeto — denominador do "% do projeto" no cronograma
  state.projHorasPrevistas = m.HORAS_PREVISTAS || 0;

  $('#d-cliente').textContent = (m.A1_NREDUZ || projeto?.nome_cliente_projeto || '').trim();
  $('#d-titulo').textContent = m.IBL_DESCRI || projeto?.descricao_projeto || '—';

  $('#d-coord2').textContent = (m.COORD2_NOME || projeto?.nome_coordenador_auxiliar || '—').trim();

  $('#d-tipo').textContent = projeto?.tipo_projeto || (m.IBL_TIPO === 'I' ? 'Implantação' : m.IBL_TIPO || '—');

  const stKey = (m.IBL_STATUS || '').trim();
  const st = STATUS_IBL[stKey] || { label: m.IBL_STATUS_DESC || stKey || '—', cls: 'bg-slate-100 text-slate-700' };
  $('#d-status').className = `px-3 py-1 rounded-full text-xs font-medium ${st.cls}`;
  $('#d-status').textContent = m.IBL_STATUS_DESC?.trim() || st.label;
  $('#d-contrato').textContent = `Contrato: ${(m.IB7_CONTRA || '—').trim()} · ${(m.IB7_FPAGTO_DESC || '').trim()}`;

  // KPIs
  const pct = m.MEDICAO_PERCENTUAL || 0;
  const pctH = m.HORAS_REALIZADAS_PERCENTUAL || 0;
  $('#d-kpis').innerHTML = `

    ${kpiDetail('Medição', `${m.MEDICAO_REALIZADA || 0} / ${m.MEDICAO_PREVISTA || 0}`, 'bg-totvs-purple text-white', fmtPct(pct))}
    ${kpiDetail('Período Atual', fmtH(m.MEDICAO_PERIODO_REALIZADO) + ' / ' + fmtH(m.MEDICAO_PERIODO_PREVISTO), 'bg-totvs-black text-white', fmtPct(m.MEDICAO_PERIODO_PERCENTUAL))}
  `;

  // Horas por tipo (horaItems)
  const items = m.horaItems || [];
  $('#d-horas').innerHTML = items.length ? items.map(it => `
    <div class="flex items-center justify-between text-sm">
      <span class="text-totvs-gray">${escapeHtml(it.descricao)}</span>
      <span class="font-mono font-semibold text-totvs-petroleo">${it.realizado || '00:00'}</span>

function renderCronograma(arvore) {
  // Denominador do "% do projeto" = total de horas PREVISTAS do projeto.
  // Vem do mapa (HORAS_PREVISTAS, definido em preencheMapa). Fallback: horas
  // previstas da maior fase do cronograma (tipicamente "Execução").
  if (!state.projHorasPrevistas) {
    state.projHorasPrevistas = Math.max(
      0, ...arvore.map(f => somaProp(f, 'horas_previstas'))
    );
  }
  const html = arvore.map(node => renderFase(node)).join('');
  $('#d-crono').innerHTML = html || '<p class="text-slate-400">Sem cronograma.</p>';
}

// Dois percentuais por linha do cronograma:
//   • "plan."     = quanto a linha já consumiu do seu próprio planejado (hr/hp)
//   • "do projeto"= quanto o realizado da linha representa do total de horas
//                   previstas do projeto inteiro (hr / HORAS_PREVISTAS)
function badgesCrono(hr, hp) {
  const pctPlan = hp > 0 ? (hr / hp) * 100 : 0;
  const pctProj = state.projHorasPrevistas > 0 ? (hr / state.projHorasPrevistas) * 100 : 0;
  // cor do "plan." sinaliza estouro de orçamento da linha
  const planCls = pctPlan > 100 ? 'bg-rose-100 text-rose-700'
                : pctPlan >= 90 ? 'bg-amber-100 text-amber-700'
                : 'bg-slate-100 text-slate-600';
  return `<span class="text-[11px] px-1.5 py-0.5 rounded ${planCls}" title="Consumido do planejado desta linha (realizado ÷ previsto da linha)">${fmtPct(pctPlan)} plan.</span>` +
         `<span class="text-[11px] px-1.5 py-0.5 rounded bg-indigo-50 text-indigo-700" title="Realizado da linha ÷ total de horas previstas do projeto">${fmtPct(pctProj)} do projeto</span>`;
}

function renderFase(fase) {
  const totHp = somaProp(fase, 'horas_previstas');

  return `<details open class="mb-2">
    <summary class="px-3 py-2 bg-slate-100 rounded-md flex items-center gap-2 hover:bg-slate-200">
      <span class="chev text-slate-500">▶</span>

      <span class="ml-auto flex items-center gap-2">
        <span class="text-xs text-slate-600">${fmtH(totHr)} / ${fmtH(totHp)} h · agendado ${fmtH(totAg)} h</span>
        ${badgesCrono(totHr, totHp)}

    </summary>
    <div class="pl-4 mt-2 space-y-1">

}

function somaProp(node, prop) {
  // Já vem agregado nos níveis 0/1/2 — usa o próprio, se ausente soma filhos
  if (typeof node[prop] === 'number') return node[prop];
  if (!node.items) return 0;
  return node.items.reduce((s, c) => s + somaProp(c, prop), 0);
}

// ============================================================================
//  VIEW: POR MÓDULO (matriz drill-down)
// ============================================================================
// Estratégia:
//   1) Coletar todas atividades nivel=3 com sua sub-etapa pai (nivel=2).
//   2) Para cada atividade: módulo = descricao_atividade - prefixo_subetapa.
//      Ex.: sub="Levantamento", atv="Levantamento Call Center" → módulo "Call Center".
//      Se não dá pra remover o prefixo, módulo = "Outros" e tipo = atv.descricao.
//   3) Agrupar por módulo, somando horas; expansão mostra as sub-etapas.

const SUBETAPAS_PADRAO = [
  'Levantamento', 'Parametrizacao', 'Capacitacao',
  'Prototipo Modular', 'Prototipo Integrado',
];
const SEM_MODULO = ['Operacao Assistida','Gestao de Projetos','Atendimento Extra Projeto','Encerramento do Projeto','Prototipo de Validacao'];

// Normaliza string p/ comparação tolerante a acentos/maiúsculas
function _norm(s) {
  return (s || '').toString().normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
}

function extraiModulo(atividade, subetapaDescricao) {
  const desc = (atividade.descricao || '').trim();
  const subNorm = _norm(subetapaDescricao);

  // 0) Sub-etapa "Específicos" — agrupa TODAS as atividades num único módulo
  //    "Específicos" (códigos numerados, Tecnologia, A Planejar, etc.).
  //    O drill-down lista cada atividade individual como linha interna.
  if (subNorm === 'especificos') {
    return { modulo: 'Específicos', subetapa: desc || 'Específicos' };
  }

  // 1) Tem prefixo conhecido?
  for (const pref of SUBETAPAS_PADRAO) {
    if (desc.toLowerCase().startsWith(pref.toLowerCase() + ' ')) {
      return { modulo: desc.slice(pref.length).trim(), subetapa: pref };
    }
  }
  // 2) Usa o nome da sub-etapa pai como prefixo
  if (subetapaDescricao && desc.toLowerCase().startsWith(subetapaDescricao.toLowerCase() + ' ')) {
    return { modulo: desc.slice(subetapaDescricao.length).trim(), subetapa: subetapaDescricao };
  }
  // 3) Atividade sem módulo
  if (SEM_MODULO.some(s => desc.toLowerCase().includes(s.toLowerCase()))) {
    return { modulo: desc, subetapa: subetapaDescricao || 'Gerenciamento' };
  }
  // 4) Fallback: agrupa por nome literal
  return { modulo: desc, subetapa: subetapaDescricao || '—' };
}

function coletaAtividades(arvore) {
  const out = []; // [{ fase, etapa, subetapa, modulo, atividade }]
  for (const fase of arvore) {
    for (const etapa of (fase.items || [])) {
      for (const sub of (etapa.items || [])) {
        // sub é nivel=2 (sub-etapa). Suas items são as atividades nivel=3.
        for (const at of (sub.items || [])) {
          const { modulo, subetapa } = extraiModulo(at, sub.descricao);
          out.push({
            fase: fase.descricao, etapa: etapa.descricao,
            subetapa, subReal: (sub.descricao || '').trim() || subetapa,
            modulo, atividade: at,
          });
        }
      }
    }
  }
  return out;
}

function aRealizar(at) {
  // Soma agendas planejadas/confirmadas que ainda não viraram apontamento.
  // Status apontado/cancelado = ZA, ZV → exclui. Status restantes = futuras.
  const ag = at.agendas || [];
  let total = 0;
  for (const a of ag) {
    if (['ZA','ZV'].includes((a.status||'').trim())) continue;
    total += (a.horas_previstas_agenda || 0);
  }
  return total;
}

function agrega(lista) {
  // Soma horas; data início = min; data fim = max
  const acc = { estimadas: 0, executadas: 0, planejadas: 0, inicio: null, fim: null, atividades: [] };
  for (const item of lista) {
    const at = item.atividade;
    acc.estimadas  += (at.horas_previstas || 0);
    acc.executadas += (at.horas_realizadas || 0);
    acc.planejadas += aRealizar(at);
    const di = at.data_inicio || '';
    const df = at.data_fim || '';
    if (di && (!acc.inicio || di < acc.inicio)) acc.inicio = di;
    if (df && (!acc.fim || df > acc.fim))       acc.fim = df;
    acc.atividades.push(item);
  }
  acc.pctExec = acc.estimadas > 0 ? (acc.executadas / acc.estimadas) * 100 : 0;
  acc.pctTotal = acc.estimadas > 0 ? ((acc.executadas + acc.planejadas) / acc.estimadas) * 100 : 0;
  return acc;
}

function pctBar(pctExec, pctTotal) {
  const e = Math.min(100, Math.max(0, pctExec));
  const t = Math.min(100, Math.max(0, pctTotal));
  return `<div class="relative h-2 bg-[#e6edf0] rounded-full overflow-hidden w-32">
    <div class="absolute top-0 left-0 h-full fill-plan" style="width:${t}%"></div>
    <div class="absolute top-0 left-0 h-full fill-exec" style="width:${e}%"></div>
  </div>`;
}

  const i = ORDEM_ETAPAS.indexOf(nome);

}

function escapeAttr(s) { return String(s).replace(/"/g, '&quot;'); }

// ============================================================================
//  EVENTS / BOOT
// ============================================================================
function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

// ── "Ver como" (só admin): simula a visão de outro usuário, sem trocar de login.
//    A simulação só restringe o escopo; nunca amplia (garantido no backend).
async function initViewAs() {
  let me;
  try { me = await api('/api/me'); } catch (_) { return; }
  const sel = $('#view-as');
  const faixa = $('#simulando');

  if (me.view_as) {
    faixa.classList.remove('hidden');
    $('#simulando-txt').textContent = `Você está vendo o dashboard como ${me.view_as} — os dados abaixo são o que ESSE usuário enxerga.`;
  }
  if (!me.is_admin) return;             // seletor é privilégio de admin

  try {
    const { usuarios } = await api('/api/usuarios');
    sel.classList.remove('hidden');
    sel.innerHTML = '<option value="">👁 Ver como…</option>' + usuarios.map(u =>
      `<option value="${u.email}" ${u.email === me.view_as ? 'selected' : ''}>${u.nome || u.email}${u.is_admin ? ' (admin)' : ` · ${u.n_clientes} cliente(s)`}</option>`
    ).join('');
    sel.addEventListener('change', async () => {
      await api('/api/view-as', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: sel.value || null })
      });
      location.reload();
    });
  } catch (_) { /* não-admin ou falha: segue sem seletor */ }
}
$('#sair-simulacao').addEventListener('click', async () => {
  await api('/api/view-as', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email: null })
  });
  location.reload();
});
initViewAs();

$('#nav-back').addEventListener('click', voltarLista);
$('#btn-refresh').addEventListener('click', () => {

});
$('#btn-sync').addEventListener('click', async () => {
  const b = $('#btn-sync');
  if (b.disabled) return;
  if (!confirm('Sincronizar a lista de projetos da API PCI? Pode levar alguns segundos.')) return;
  b.disabled = true;
  const txt = b.textContent;
  let page = 1, total = 0;
  try {
    while (page <= 50) {
      b.textContent = `⟳ Sincronizando… pág ${page}`;
      const j = await api(`/api/sync?page=${page}`, { method: 'POST' });
      total += j.gravados || 0;
      if (!j.hasNext) break;
      page++;
    }
    b.textContent = txt; b.disabled = false;
    alert(`Sincronização concluída: ${total} projeto(s) atualizados.`);
    carregaLista();
  } catch (e) {
    b.textContent = txt; b.disabled = false;
    alert('Falha ao sincronizar: ' + e.message);
  }
});

      $$('#cad-conteudo details.cad-grupo').forEach(d => d.open = act === 'cad-expandir');

    if (state.tab === 'crono') {

function setTab(nome) {
  state.tab = nome;
  $$('.tab-btn').forEach(b => {
    const active = b.dataset.tab === state.tab;
    b.className = `tab-btn px-4 py-2 text-sm border-b-2 ${active ? 'border-totvs-blue text-totvs-petroleo font-semibold' : 'border-transparent text-slate-500 hover:text-totvs-petroleo'}`;
  });
  ['resumo', 'crono', 'modulos', 'etapas'].forEach(t => {
    $(`#tab-${t}`).classList.toggle('hidden', state.tab !== t);
  });
  // Expandir/Recolher só faz sentido nas abas com árvore
  $('#tab-acoes').classList.toggle('hidden', state.tab === 'resumo');
}

// ============================================================================
//  NAVEGAÇÃO GLOBAL (Projetos | Cadastros | Transição)
// ============================================================================
function setApp(nome) {
  state.app = nome;
  $$('.app-tab').forEach(b => b.classList.toggle('is-active', b.dataset.app === nome));
  // Projetos mantém o par lista/detalhe; as outras são views próprias
  const emDetalhe = nome === 'projetos' && state.view === 'detalhe';
  $('#view-lista').classList.toggle('hidden', nome !== 'projetos' || emDetalhe);
  $('#view-detalhe').classList.toggle('hidden', !emDetalhe);
  $('#nav-back').classList.toggle('hidden', !emDetalhe);
  $('#view-cadastros').classList.toggle('hidden', nome !== 'cadastros');
  $('#view-transicao').classList.toggle('hidden', nome !== 'transicao');
  window.scrollTo(0, 0);
  if (nome === 'cadastros') initCadastros();
  if (nome === 'transicao') initTransicao();
}

document.addEventListener('click', e => {

}

// ============================================================================
//  ABA CADASTROS (MONITCAD) — status de carga dos cadastros por cliente
// ============================================================================
const cad = { carregado: false, customer: null };

async function initCadastros() {
  if (cad.carregado) return;
  cad.carregado = true;
  const sel = $('#cad-cliente');
  // Reaproveita a lista de clientes já recortada pelo acesso do usuário
  try {
    const j = await api('/api/clientes');
    sel.innerHTML = '<option value="">Selecione o cliente…</option>' +
      (j.clientes || []).map(c => `<option value="${c.codigo}">${escapeHtml(c.nome)}</option>`).join('');
  } catch (e) {
    $('#cad-conteudo').innerHTML = blocoErro('Não foi possível listar os clientes', e, () => { cad.carregado = false; initCadastros(); });
    return;
  }
  sel.addEventListener('change', () => carregaCadastros(sel.value));
  $('#cad-reload').addEventListener('click', () => carregaCadastros(cad.customer));
  $('#cad-file').addEventListener('change', enviaMedicao);
  $('#cad-conteudo').innerHTML = blocoVazioCad('Selecione um cliente para ver o status dos cadastros.');
}

function blocoVazioCad(msg, extra = '') {
  return `<div class="bg-white rounded-lg border border-slate-200 p-10 text-center">
    <p class="text-slate-500">${escapeHtml(msg)}</p>${extra}</div>`;
}

async function carregaCadastros(customer) {
  cad.customer = customer || null;
  const box = $('#cad-conteudo');
  if (!customer) { box.innerHTML = blocoVazioCad('Selecione um cliente para ver o status dos cadastros.'); return; }
  box.innerHTML = '<div class="text-slate-400 text-sm py-6 text-center">Carregando medições…</div>';
  let j;
  try {
    j = await api(`/api/monitcad/${encodeURIComponent(customer)}`);
  } catch (e) {
    box.innerHTML = blocoErro('Não foi possível carregar os cadastros', e, () => carregaCadastros(customer));
    return;
  }
  if (j.vazio) {
    box.innerHTML = blocoVazioCad(
      'Nenhuma medição publicada para este cliente ainda.',
      '<p class="text-xs text-slate-400 mt-2">O job U_MONITPUSH() no Protheus ainda não enviou dados. ' +
      'Use "⬆ Subir medição (.json)" para carregar o historico-semanal.json manualmente.</p>');
    return;
  }
  box.innerHTML = renderCadastros(j);
}

function corStatus(s) {
  return ({ VERDE: 'bg-emerald-100 text-emerald-800', AMARELO: 'bg-amber-100 text-amber-800',
            VERMELHO: 'bg-rose-100 text-rose-800' })[(s || '').toUpperCase()]
         || 'bg-slate-100 text-slate-700';
}

function renderCadastros(j) {
  const t = j.tabelas || [], serie = j.serie || [], p = j.projeto || {};
  const mods = j.modulos || [];
  const comEst = !!j.tem_estimativa;          // sem estimativa cadastrada não há %
  const totR = t.reduce((a, x) => a + Number(x.realizado || 0), 0);
  const totE = t.reduce((a, x) => a + Number(x.estimativa || 0), 0);
  const pct = totE > 0 ? (100 * totR / totE) : null;
  const comCarga = t.filter(x => Number(x.realizado || 0) > 0).length;
  const nVerm = t.filter(x => (x.status || '').toUpperCase() === 'VERMELHO').length;
  const nAmar = t.filter(x => (x.status || '').toUpperCase() === 'AMARELO').length;
  const antS = serie.length > 1 ? serie[serie.length - 2] : null;
  const deltaPct = (comEst && antS && antS.pct != null) ? (pct - Number(antS.pct)) : null;
  const deltaReg = antS ? (totR - Number(antS.realizado || 0)) : null;

  const kpi = (rot, val, sub, cls) => `
    <div class="rounded-lg p-4 ${cls}">
      <p class="text-xs opacity-80">${rot}</p>
      <p class="text-2xl font-totvs mt-1">${val}</p>
      ${sub ? `<p class="text-xs opacity-80 mt-0.5">${sub}</p>` : ''}
    </div>`;

  const kpis = comEst
    ? [kpi('Carga geral', pct.toFixed(1) + '%', deltaPct === null ? 'primeira medição' : `${deltaPct >= 0 ? '▲' : '▼'} ${Math.abs(deltaPct).toFixed(1)} p.p. vs anterior`, 'bg-totvs-petroleo text-white'),
       kpi('Registros carregados', fmtNum(totR), `de ${fmtNum(totE)} estimados`, 'bg-totvs-blue text-totvs-petroleo'),
       kpi('Tabelas monitoradas', String(t.length), `${comCarga} com carga`, 'bg-totvs-purple text-white'),
       kpi('Em risco', String(nVerm + nAmar), `${nVerm} vermelha(s) · ${nAmar} amarela(s)`, 'bg-white border border-slate-200 text-totvs-petroleo')]
    : [kpi('Registros carregados', fmtNum(totR), deltaReg === null ? 'primeira medição' : `${deltaReg >= 0 ? '▲' : '▼'} ${fmtNum(Math.abs(deltaReg))} vs anterior`, 'bg-totvs-petroleo text-white'),
       kpi('Tabelas com carga', `${comCarga}/${t.length}`, `${t.length - comCarga} ainda zerada(s)`, 'bg-totvs-blue text-totvs-petroleo'),
       kpi('Módulos', String(mods.length), 'com tabela monitorada', 'bg-totvs-purple text-white'),
       kpi('% de carga', '—', 'sem estimativa cadastrada', 'bg-white border border-slate-200 text-totvs-gray')];

  const aviso = comEst ? '' : `
    <div class="bg-totvs-yellow/10 border border-totvs-yellow/40 rounded-lg px-4 py-3 mb-4 text-sm">
      <span class="font-semibold text-totvs-petroleo">Sem estimativa cadastrada.</span>
      <span class="text-slate-600">Os números são a contagem absoluta da última medição.
      Para ter % e semáforo, cadastre a estimativa por tabela (monitcad.estimativas /
      TABELAS_MONITOR.TXT) ou suba um historico-semanal.json que já traga a estimativa.</span>
    </div>`;

  // ── Tabelas agrupadas por módulo (accordion) ──────────────────────────────
  const maxMod = Math.max(1, ...mods.map(m => Number(m.registros || 0)));
  const porModulo = new Map();
  t.forEach(x => {
    const k = x.modulo || '(sem módulo)';
    if (!porModulo.has(k)) porModulo.set(k, []);
    porModulo.get(k).push(x);
  });
  // Ordem dos grupos = a do backend (registros desc); sobras vão para o fim
  const ordem = mods.map(m => m.modulo).filter(k => porModulo.has(k));
  [...porModulo.keys()].forEach(k => { if (!ordem.includes(k)) ordem.push(k); });

  const cabecalho = comEst
    ? `<th class="pb-2 pr-3 text-right">Estimativa</th><th class="pb-2 pr-3 text-right">%</th>
       <th class="pb-2 pr-3">Progresso</th><th class="pb-2 pr-3">Etapa</th>
       <th class="pb-2 pr-3">Responsável</th><th class="pb-2 pr-3">Previsão</th><th class="pb-2">Status</th>`
    : '<th class="pb-2">Situação</th>';

  const linhaTabela = (x) => {
    const est = Number(x.estimativa || 0);
    const pc = x.percentual != null ? Number(x.percentual)
             : (est > 0 ? 100 * Number(x.realizado) / est : null);
    return `<tr class="border-t border-slate-100">
      <td class="py-2 pr-3 font-mono text-xs">${escapeHtml(x.tabela || '')}</td>
      <td class="py-2 pr-3">${escapeHtml(x.descricao || '—')}</td>
      <td class="py-2 pr-3 text-right tabular-nums ${Number(x.realizado) > 0 ? 'font-medium' : 'text-slate-400'}">${fmtNum(x.realizado)}</td>
      ${comEst ? `
      <td class="py-2 pr-3 text-right tabular-nums">${est > 0 ? fmtNum(est) : '—'}</td>
      <td class="py-2 pr-3 text-right tabular-nums font-semibold">${pc === null ? '—' : pc.toFixed(1) + '%'}</td>
      <td class="py-2 pr-3 w-40"><div class="bar-track"><div class="bar-fill fill-exec" style="width:${pc === null ? 0 : Math.min(100, pc).toFixed(1)}%"></div></div></td>
      <td class="py-2 pr-3 text-xs">${escapeHtml(x.etapa || '—')}</td>
      <td class="py-2 pr-3 text-xs">${escapeHtml(x.responsavel || '—')}</td>
      <td class="py-2 pr-3 text-xs">${x.data_prev ? fmtData(String(x.data_prev)) : '—'}</td>
      <td class="py-2"><span class="px-2 py-0.5 rounded-full text-xs font-medium ${corStatus(x.status)}">${escapeHtml(x.status || '—')}</span></td>`
      : `<td class="py-2"><span class="px-2 py-0.5 rounded-full text-xs font-medium ${Number(x.realizado) > 0 ? 'bg-emerald-100 text-emerald-800' : 'bg-slate-100 text-slate-500'}">${Number(x.realizado) > 0 ? 'Com carga' : 'Zerada'}</span></td>`}
    </tr>`;
  };

  const grupos = ordem.map(nome => {
    const itens = porModulo.get(nome);
    const reg = itens.reduce((a, x) => a + Number(x.realizado || 0), 0);
    const cc = itens.filter(x => Number(x.realizado || 0) > 0).length;
    // Já abre nos módulos que têm carga; os zerados nascem recolhidos
    return `
      <details class="cad-grupo border-b border-slate-100 last:border-b-0" ${reg > 0 ? 'open' : ''}>
        <summary class="flex items-center gap-3 py-2.5 text-sm hover:bg-slate-50 -mx-2 px-2 rounded">
          <span class="chev text-slate-400 text-xs">▶</span>
          <span class="w-48 truncate font-medium ${reg > 0 ? 'text-totvs-petroleo' : 'text-slate-500'}">${escapeHtml(nome)}</span>
          <div class="flex-1 bar-track"><div class="bar-fill fill-exec" style="width:${(100 * reg / maxMod).toFixed(1)}%"></div></div>
          <span class="w-24 text-right tabular-nums font-semibold ${reg > 0 ? '' : 'text-slate-400'}">${fmtNum(reg)}</span>
          <span class="w-24 text-right text-xs text-slate-500">${cc}/${itens.length} tabelas</span>
        </summary>
        <div class="overflow-x-auto pl-7 pb-3">
          <table class="w-full text-sm">
            <thead><tr class="text-xs text-slate-500 text-left">
              <th class="pb-2 pr-3">Tabela</th><th class="pb-2 pr-3">Descrição</th>
              <th class="pb-2 pr-3 text-right">Realizado</th>
              ${cabecalho}
            </tr></thead>
            <tbody>${itens.map(linhaTabela).join('')}</tbody>
          </table>
        </div>
      </details>`;
  }).join('');

  const maxSerie = Math.max(1, ...serie.map(s => Number(s.realizado || 0)));
  const hist = serie.map(s => {
    const largura = comEst && s.pct != null ? Math.min(100, Number(s.pct))
                                            : (100 * Number(s.realizado || 0) / maxSerie);
    const valor = comEst && s.pct != null ? Number(s.pct).toFixed(1) + '%' : fmtNum(s.realizado);
    return `<div class="flex items-center gap-3 text-sm">
      <span class="w-28 text-slate-500 text-xs">${fmtData(String(s.data_medicao))}${s.semana ? ` · S${s.semana}` : ''}</span>
      <div class="flex-1 bar-track"><div class="bar-fill fill-exec" style="width:${largura.toFixed(1)}%"></div></div>
      <span class="w-24 text-right tabular-nums font-medium">${valor}</span>
      <span class="w-24 text-right text-xs text-slate-500">${s.tabelas_com_carga} c/ carga</span>
    </div>`;
  }).join('');

  return `
    <div class="bg-white rounded-lg border border-slate-200 p-5 mb-4">
      <div class="flex items-start justify-between flex-wrap gap-3">
        <div>
          <p class="text-xs text-totvs-blue uppercase tracking-wide font-semibold">${escapeHtml(p.cliente_nome || '')}</p>
          <h2 class="text-xl font-totvs text-totvs-petroleo mt-0.5">${escapeHtml(p.projeto || 'Monitoramento de Cadastros')}</h2>
        </div>
        <p class="text-xs text-slate-500">Última medição: <span class="font-medium">${fmtData(String(j.ultima_medicao || ''))}</span> · ${j.total_medicoes} medição(ões)</p>
      </div>
    </div>
    ${aviso}
    <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4">${kpis.join('')}</div>
    <div class="bg-white rounded-lg border border-slate-200 p-5 mb-4">
      <h3 class="text-sm font-semibold text-slate-700 mb-3">Evolução por medição</h3>
      <div class="space-y-2">${hist || '<p class="text-sm text-slate-400">Sem histórico.</p>'}</div>
    </div>
    <div class="bg-white rounded-lg border border-slate-200 p-5">
      <div class="flex items-center justify-between mb-3">
        <h3 class="text-sm font-semibold text-slate-700">Tabelas monitoradas por módulo</h3>
        <div class="flex items-center gap-2 text-xs">
          <button data-act="cad-expandir" class="px-2 py-1 rounded border border-slate-300 hover:bg-slate-50">Expandir</button>
          <button data-act="cad-recolher" class="px-2 py-1 rounded border border-slate-300 hover:bg-slate-50">Recolher</button>
        </div>
      </div>
      ${grupos || '<p class="text-sm text-slate-400">Sem tabelas na última medição.</p>'}
    </div>`;
}

function fmtNum(n) {
  return Number(n || 0).toLocaleString('pt-BR', { maximumFractionDigits: 0 });
}

async function enviaMedicao(ev) {
  const f = ev.target.files?.[0];
  ev.target.value = '';
  if (!f) return;
  if (!cad.customer) { alert('Selecione o cliente antes de subir a medição.'); return; }
  let payload;
  try {
    payload = JSON.parse(await f.text());
  } catch (e) {
    alert('Arquivo não é um JSON válido: ' + e.message);
    return;
  }
  try {
    const j = await api(`/api/monitcad/${encodeURIComponent(cad.customer)}/upload`,
      { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
    alert(`Medições gravadas: ${j.medicoes} · linhas de tabela: ${j.tabelas}`);
    carregaCadastros(cad.customer);
  } catch (e) {
    alert('Falha ao subir a medição: ' + e.message);
  }
}

// ============================================================================
//  ABA TRANSIÇÃO — painel de status entregue ao cliente
//  O HTML vem de cockpit.paineis_cliente (fora do git: carrega dado do cliente).
// ============================================================================
const tr = { carregado: false, atual: null, podeSubir: false };

async function initTransicao() {
  if (tr.carregado) return;
  tr.carregado = true;
  let j;
  try {
    j = await api('/api/paineis');
  } catch (e) {
    $('#tr-conteudo').innerHTML = blocoErro('Não foi possível listar os painéis', e, () => { tr.carregado = false; initTransicao(); });
    return;
  }
  tr.podeSubir = !!j.pode_subir;
  $('#tr-upload-wrap').classList.toggle('hidden', !tr.podeSubir);
  const sel = $('#tr-painel');
  sel.innerHTML = '<option value="">Selecione o painel…</option>' +
    (j.paineis || []).map(p => `<option value="${p.customer}/${p.slug}">${escapeHtml(p.cliente_nome)} · ${escapeHtml(p.titulo || p.slug)}</option>`).join('');
  sel.addEventListener('change', () => abrePainel(sel.value));
  $('#tr-file').addEventListener('change', publicaPainel);

  if ((j.paineis || []).length === 0) {
    $('#tr-conteudo').innerHTML = blocoVazioCad(
      'Nenhum painel publicado ainda.',
      tr.podeSubir
        ? '<p class="text-xs text-slate-400 mt-2">Use "⬆ Publicar painel (.html)" para subir o HTML do status por atividades.</p>'
        : '<p class="text-xs text-slate-400 mt-2">Peça ao administrador para publicar o painel do seu cliente.</p>');
  } else if ((j.paineis || []).length === 1) {
    sel.value = `${j.paineis[0].customer}/${j.paineis[0].slug}`;   // só um: já abre
    abrePainel(sel.value);
  } else {
    $('#tr-conteudo').innerHTML = blocoVazioCad('Selecione o painel para visualizar.');
  }
}

function abrePainel(ref) {
  tr.atual = ref || null;
  const box = $('#transicao-box'), fr = $('#frame-transicao');
  if (!ref) { box.classList.add('hidden'); $('#tr-conteudo').innerHTML = blocoVazioCad('Selecione o painel para visualizar.'); return; }
  $('#tr-conteudo').innerHTML = '';
  box.classList.remove('hidden');
  fr.src = `/painel/${ref}`;
  // Página inteira dentro do iframe: acompanha a altura para não ter scroll duplo
  const ajusta = () => {
    try {
      const h = fr.contentDocument?.body?.scrollHeight;
      fr.style.height = h ? (h + 40) + 'px' : '85vh';
    } catch { fr.style.height = '85vh'; }
  };
  fr.onload = () => { ajusta(); setTimeout(ajusta, 800); };
  window.addEventListener('resize', ajusta);
}

async function publicaPainel(ev) {
  const f = ev.target.files?.[0];
  ev.target.value = '';
  if (!f) return;
  const ref = tr.atual || prompt('Publicar em qual painel? Informe CUSTOMER/slug (ex.: TFEHXQ00/transicao)');
  if (!ref || !ref.includes('/')) return;
  const titulo = prompt('Título do painel:', f.name.replace(/\.html?$/i, '')) || ref.split('/')[1];
  try {
    const j = await api(`/api/paineis/${ref}?titulo=${encodeURIComponent(titulo)}`,
      { method: 'POST', headers: { 'Content-Type': 'text/html' }, body: await f.text() });
    alert(`Painel publicado (${(j.bytes / 1024).toFixed(0)} KB).`);
    tr.carregado = false;
    $('#tr-painel').innerHTML = '';
    await initTransicao();
    $('#tr-painel').value = ref;
    abrePainel(ref);
  } catch (e) {
    alert('Falha ao publicar o painel: ' + e.message);
  }
}

carregaLista();
